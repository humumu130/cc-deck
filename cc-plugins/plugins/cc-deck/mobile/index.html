<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050B12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CC Watch">
<title>CC Watch</title>
<style>
:root {
  --bg: #050B12;
  --panel: #0B1622;
  --panel-2: #101F30;
  --line: rgba(125, 165, 220, 0.10);
  --text: #E8F0FA;
  --dim: #7B93AE;
  --faint: #4A5F78;
  --brand-a: #4D9FFF;
  --brand-b: #7C6CF2;
  --grad: linear-gradient(135deg, #4D9FFF 0%, #7C6CF2 100%);
  --working: #FFC53D;
  --waiting: #F0524F;
  --error: #FF7849;
  --done: #2BD98F;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
input, textarea { user-select: text; font-family: inherit; }
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }

/* ---------- 品牌头部 ---------- */
#topbar {
  position: sticky; top: 0; z-index: 20;
  padding: calc(var(--safe-t) + 12px) 16px 12px;
  background: linear-gradient(180deg, rgba(9,18,30,0.98) 0%, rgba(5,11,18,0.92) 100%);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.toprow { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 34px; height: 34px; border-radius: 10px; background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; color: #fff; letter-spacing: -0.5px;
  box-shadow: 0 2px 12px rgba(93, 134, 245, 0.35);
  flex: none;
}
.toprow h1 { font-size: 17px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#connChip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; padding: 4px 9px; border-radius: 999px;
  background: rgba(125, 165, 220, 0.08); color: var(--dim);
  border: 1px solid var(--line); white-space: nowrap;
}
#connChip::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint);
}
#connChip.on::before { background: var(--working); box-shadow: 0 0 6px var(--working); }
#connChip.on { color: var(--working); border-color: rgba(43, 217, 143, 0.3); }
#connChip.wait::before { background: var(--waiting); animation: blink 1s infinite; }
#connChip.wait { color: var(--waiting); }
#connChip.err::before { background: var(--error); }
#connChip.err { color: var(--error); }
@keyframes blink { 50% { opacity: 0.25; } }
#runhint { font-size: 12px; color: var(--dim); margin-top: 7px; padding-left: 2px; }

/* ---------- 会话卡片列表 ---------- */
#list { padding: 12px 14px calc(120px + var(--safe-b)); }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 15px; margin-bottom: 11px;
  transition: transform 0.06s ease;
}
.card:active { transform: scale(0.985); }
.card .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.WORKING { background: var(--working); animation: blink 1.1s infinite; box-shadow: 0 0 6px var(--working); }
.dot.WAITING { background: var(--waiting); animation: blink 1.2s infinite; }
.dot.ERROR { background: var(--error); }
.dot.DONE { background: var(--done); opacity: 0.85; }
@keyframes breathe { 0%,100% { opacity: 0.45; transform: scale(0.85);} 50% { opacity: 1; transform: scale(1.15);} }
.st { font-size: 12px; font-weight: 600; flex: 1; }
.st.WORKING { color: var(--working); } .st.WAITING { color: var(--waiting); }
.st.ERROR { color: var(--error); } .st.DONE { color: var(--done); }
.elapsed { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ctitle {
  font-size: 15px; font-weight: 650; margin-bottom: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.csum { font-size: 13px; color: var(--dim); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cfoot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); }
.cfoot .spacer { flex: 1; }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 6px; background: rgba(125,165,220,0.08); color: var(--dim); border: 1px solid var(--line); }
.tag.ext { background: rgba(124, 108, 242, 0.12); color: #A99CF5; border-color: rgba(124,108,242,0.25); }
.statsline { font-variant-numeric: tabular-nums; }
.add { color: var(--working); } .del { color: var(--error); }
.empty {
  text-align: center; color: var(--faint); padding: 70px 30px; font-size: 14px;
}
.empty .big { font-size: 42px; margin-bottom: 14px; opacity: 0.5; }

/* ---------- FAB ---------- */
#fab {
  position: fixed; right: 18px; bottom: calc(24px + var(--safe-b));
  width: 56px; height: 56px; border-radius: 18px;
  background: var(--grad); color: #fff; font-size: 30px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 22px rgba(93, 134, 245, 0.45);
  z-index: 30; transition: transform 0.08s;
}
#fab:active { transform: scale(0.92); }

/* ---------- 详情页 ---------- */
#detail {
  position: fixed; inset: 0; z-index: 40; background: var(--bg);
  display: none; flex-direction: column;
}
#detail.open { display: flex; }
#dhead {
  padding: calc(var(--safe-t) + 10px) 14px 10px;
  border-bottom: 1px solid var(--line);
  background: rgba(9, 18, 30, 0.96);
}
.dhead-row { display: flex; align-items: center; gap: 10px; }
.back {
  width: 36px; height: 36px; border-radius: 11px; flex: none;
  background: rgba(125,165,220,0.08); color: var(--dim);
  display: flex; align-items: center; justify-content: center; font-size: 19px;
}
.dhead-title { flex: 1; min-width: 0; }
.dhead-title .t { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dhead-title .s { font-size: 11px; color: var(--dim); display: flex; gap: 8px; margin-top: 1px; align-items: center; }
#dBody { flex: 1; overflow-y: auto; padding: 14px 14px calc(150px + var(--safe-b)); -webkit-overflow-scrolling: touch; }

/* 审批横幅 */
#waitBanner {
  display: none; margin-bottom: 14px; padding: 14px;
  border-radius: 16px; border: 1px solid rgba(245, 184, 65, 0.4);
  background: linear-gradient(180deg, rgba(245,184,65,0.10), rgba(245,184,65,0.04));
}
#waitBanner.show { display: block; }
#waitBanner .wt { color: var(--waiting); font-weight: 700; font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
#waitBanner .wt::before { content: "◐"; font-size: 16px; animation: blink 1.2s infinite; }
#waitBanner .tool { font-size: 13px; margin-bottom: 4px; }
#waitBanner .tool b { color: var(--waiting); font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
#waitBanner .desc { font-size: 13px; color: var(--dim); margin-bottom: 12px; word-break: break-all; max-height: 100px; overflow-y: auto; }
.wbtns { display: flex; gap: 10px; }
.btn {
  flex: 1; height: 44px; border-radius: 13px; font-size: 14.5px; font-weight: 650;
  display: flex; align-items: center; justify-content: center;
}
.btn.allow { background: rgba(43,217,143,0.14); color: var(--working); border: 1px solid rgba(43,217,143,0.35); }
.btn.allow:active { background: rgba(43,217,143,0.25); }
.btn.reject { background: rgba(240,82,79,0.10); color: var(--error); border: 1px solid rgba(240,82,79,0.3); }
.btn.reject:active { background: rgba(240,82,79,0.2); }

/* 状态总览块 */
.ovcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 15px; margin-bottom: 12px; }
.ovtop { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ovtop .dot { width: 12px; height: 12px; }
.ovtop .st { font-size: 14px; }
.ovrow { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-top: 1px solid var(--line); }
.ovrow:first-of-type { border-top: none; }
.ovrow .k { color: var(--dim); }
.ovrow .v { font-variant-numeric: tabular-nums; text-align: right; max-width: 65%; word-break: break-all; }
.ovrow .v.bigadd { color: var(--working); }

/* 操作按钮区 */
.ops { display: flex; gap: 10px; margin-bottom: 12px; }
.op {
  flex: 1; height: 42px; border-radius: 13px; font-size: 13.5px; font-weight: 600;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
}
.op:active { background: #16283D; }
.op.warn { color: var(--error); border-color: rgba(240,82,79,0.3); }
.op.grad { background: var(--grad); border: none; color: #fff; box-shadow: 0 3px 14px rgba(93,134,245,0.3); }

/* Tab */
#tabs { display: flex; gap: 7px; margin-bottom: 12px; }
.tab {
  flex: 1; height: 36px; border-radius: 11px; font-size: 13px; font-weight: 600;
  color: var(--dim); background: rgba(125,165,220,0.06); border: 1px solid transparent;
}
.tab.on { color: #fff; background: rgba(93,134,245,0.16); border-color: rgba(93,134,245,0.4); }

/* 时间线 */
.tl-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(125,165,220,0.06); }
.tl-time { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 3px; width: 40px; flex: none; }
.tl-body { flex: 1; min-width: 0; }
.tl-text { font-size: 13px; color: var(--text); word-break: break-word; }
.tl-text.tool_use { color: #9FC4F0; }
.tl-text.tool_result { color: var(--dim); }
.tl-text.system { color: #A99CF5; }
.tl-text.user_message { color: var(--working); }
.tl-text.assistant_text { color: var(--text); }
.tl-tool { font-size: 11px; color: var(--faint); margin-bottom: 2px; font-family: ui-monospace, Consolas, monospace; }

/* 底部命令栏 */
#cmdbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 10px 12px calc(10px + var(--safe-b));
  background: rgba(8, 15, 26, 0.97); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  display: flex; gap: 9px; align-items: flex-end;
}
#msginput {
  flex: 1; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 13px; color: var(--text); font-size: 15px;
  padding: 11px 14px; outline: none; max-height: 110px; resize: none;
  line-height: 1.4;
}
#msginput:focus { border-color: rgba(93,134,245,0.5); }
#sendBtn {
  width: 44px; height: 44px; border-radius: 13px; flex: none;
  background: var(--grad); color: #fff; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 12px rgba(93,134,245,0.35);
}
#sendBtn:active { transform: scale(0.92); }
#sendBtn:disabled { opacity: 0.35; box-shadow: none; }

/* ---------- 新建会话底部弹层 ---------- */
#sheetWrap {
  position: fixed; inset: 0; z-index: 60; display: none;
  background: rgba(2, 5, 10, 0.65); backdrop-filter: blur(3px);
}
#sheetWrap.open { display: block; }
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: #0A141F; border-radius: 22px 22px 0 0;
  padding: 18px 16px calc(20px + var(--safe-b));
  border-top: 1px solid var(--line);
  animation: up 0.18s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: 0.4; } }
#sheet h3 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
#sheet h3::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--grad); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
.field input, .field textarea {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 13px; color: var(--text);
  font-size: 15px; outline: none;
}
.field textarea { min-height: 88px; resize: none; line-height: 1.45; }
.field input:focus, .field textarea:focus { border-color: rgba(93,134,245,0.5); }
#createBtn {
  width: 100%; height: 48px; border-radius: 14px; margin-top: 4px;
  background: var(--grad); color: #fff; font-size: 15.5px; font-weight: 700;
  box-shadow: 0 4px 18px rgba(93,134,245,0.4);
}
#createBtn:active { transform: scale(0.98); }
#sheet .cancel { width: 100%; height: 42px; margin-top: 8px; color: var(--dim); font-size: 14px; }

/* ---------- 连接设置 ---------- */
#setup {
  position: fixed; inset: 0; z-index: 80; background: var(--bg);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 30px 26px;
}
#setup.open { display: flex; }
#setup .logo { width: 64px; height: 64px; border-radius: 19px; font-size: 22px; margin-bottom: 16px; }
#setup h2 { font-size: 21px; margin-bottom: 4px; }
#setup .sub { font-size: 13px; color: var(--dim); margin-bottom: 28px; }
#setup .field { width: 100%; max-width: 340px; }
#setup #setupBtn {
  width: 100%; max-width: 340px; height: 48px; border-radius: 14px; margin-top: 8px;
  background: var(--grad); color: #fff; font-size: 15.5px; font-weight: 700;
}
#setup .hint { font-size: 12px; color: var(--faint); margin-top: 16px; text-align: center; max-width: 320px; }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(90px + var(--safe-b));
  transform: translateX(-50%) translateY(16px);
  background: #16283D; color: var(--text); font-size: 13.5px;
  padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line);
  opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 90;
  max-width: 86vw; text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.histnote { font-size: 11px; color: var(--faint); text-align: center; margin: 4px 0 10px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="toprow">
    <div class="logo">CC</div>
    <h1>Cloud Code</h1>
    <div id="connChip"><span id="connText">未连接</span></div>
  </div>
  <div id="runhint">等待连接</div>
</div>

<div id="list"></div>

<button id="fab" onclick="openSheet()">＋</button>

<div id="detail">
  <div id="dhead">
    <div class="dhead-row">
      <button class="back" onclick="closeDetail()">‹</button>
      <div class="dhead-title">
        <div class="t" id="dTitle">—</div>
        <div class="s" id="dSub"></div>
      </div>
    </div>
  </div>
  <div id="dBody">
    <div id="waitBanner">
      <div class="wt">等待你的确认</div>
      <div class="tool">工具 <b id="wTool">—</b></div>
      <div class="desc" id="wDesc"></div>
      <div class="wbtns">
        <button class="btn allow" onclick="decide(true)">✓ 允许</button>
        <button class="btn reject" onclick="decide(false)">✕ 拒绝</button>
      </div>
    </div>
    <div id="dContent"></div>
  </div>
  <div id="cmdbar">
    <textarea id="msginput" rows="1" placeholder="发送消息…" maxlength="2000"></textarea>
    <button id="sendBtn" onclick="sendMsg()">➤</button>
  </div>
</div>

<div id="sheetWrap" onclick="if(event.target===this)closeSheet()">
  <div id="sheet">
    <h3>新建托管会话</h3>
    <div class="field">
      <label>工作目录（PC 上的路径）</label>
      <input id="cwdInput" placeholder="D:\dev\myproject" spellcheck="false">
    </div>
    <div class="field">
      <label>任务提示词</label>
      <textarea id="promptInput" placeholder="描述要 Claude 做什么…"></textarea>
    </div>
    <button id="createBtn" onclick="createSession()">启动会话</button>
    <button class="cancel" onclick="closeSheet()">取消</button>
  </div>
</div>

<div id="setup">
  <div class="logo">CC</div>
  <h2>Cloud Code</h2>
  <div class="sub">连接到 PC Relay</div>
  <div class="field">
    <label>Relay 地址</label>
    <input id="suUrl" placeholder="ws://192.168.0.105:8787/ws" spellcheck="false" autocapitalize="off">
  </div>
  <div class="field">
    <label>访问令牌</label>
    <input id="suToken" placeholder="token" spellcheck="false" autocapitalize="off">
  </div>
  <button id="setupBtn" onclick="saveSetup()">连接</button>
  <div class="hint">手机需与 PC 在同一 WiFi。地址填 PC 的 ws://IP:8787/ws</div>
</div>

<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

let ws = null;
let lastSeq = 0;
let connected = false;
let selected = null;
let activeTab = "activity";
const sessions = new Map();
const timelines = new Map();
let reconnectDelay = 1000;
let reconnectTimer = null;

const STATUS = {
  WORKING: { zh: "运行中" },
  WAITING: { zh: "等待确认" },
  ERROR:   { zh: "错误" },
  DONE:    { zh: "已完成" },
};

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
  });
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms || 8); } catch {} }
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}

// ---------- 配置 ----------
function wsUrl() {
  const q = new URLSearchParams(location.search);
  const token = q.get("token") || localStorage.getItem("ccr_token") || "";
  let base = localStorage.getItem("ccr_ws");
  if (!base && location.protocol.startsWith("http")) {
    base = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  }
  if (q.get("token")) localStorage.setItem("ccr_token", token);
  return { base, token };
}

// ---------- 连接 ----------
function connect() {
  const { base, token } = wsUrl();
  if (!base || !token) { openSetup(); return; }
  clearTimeout(reconnectTimer);
  const url = base + "?token=" + encodeURIComponent(token) +
    (lastSeq > 0 ? "&last_seq=" + lastSeq : "");
  setConn("wait", "连接中");
  try { ws && ws.close(); } catch {}
  ws = new WebSocket(url);
  ws.onopen = () => { connected = true; reconnectDelay = 1000; setConn("on", "已连接"); render(); };
  ws.onclose = () => {
    connected = false; setConn("err", "已断开");
    scheduleReconnect();
  };
  ws.onerror = () => {};
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === "COMMAND_ACK") { onAck(msg); return; }
    if (msg.seq !== undefined) lastSeq = Math.max(lastSeq, msg.seq);
    onEvent(msg);
  };
}
function scheduleReconnect() {
  const { base, token } = wsUrl();
  if (!base || !token) return;
  const delay = reconnectDelay;
  reconnectDelay = Math.min(reconnectDelay * 2, 10000);
  setConn("wait", delay / 1000 + "s后重连");
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connect, delay);
}
function setConn(cls, text) {
  const c = $("connChip");
  c.className = cls;
  $("connText").textContent = text;
}
function sendCommand(type, payload) {
  if (!connected) { toast("未连接"); return false; }
  ws.send(JSON.stringify({ command_id: uuid(), type, payload, ts: Date.now() }));
  return true;
}
function onAck(ack) {
  if (!ack.ok && ack.error && !ack.error.startsWith("duplicate")) {
    toast("命令失败: " + ack.error);
    buzz(30);
  }
}

// ---------- 事件处理 ----------
function onEvent(msg) {
  const sid = msg.session_id;
  switch (msg.type) {
    case "SNAPSHOT": {
      sessions.clear(); timelines.clear();
      for (const s of msg.payload.sessions) {
        sessions.set(s.session_id, s);
        timelines.set(s.session_id, msg.payload.logs[s.session_id] || []);
      }
      lastSeq = Math.max(lastSeq, msg.seq);
      if (selected && !sessions.has(selected)) closeDetail();
      break;
    }
    case "SESSION_CREATED": {
      sessions.set(sid, {
        session_id: sid, cwd: msg.payload.cwd, initial_prompt: msg.payload.initial_prompt,
        title: msg.payload.title || msg.payload.initial_prompt.slice(0, 24),
        model: msg.payload.model, status: "WORKING", action_summary: "启动中",
        external: msg.payload.external || false, remote_mode: false,
        started_at: msg.ts, updated_at: msg.ts,
        stats: { files_changed: 0, lines_added: 0, lines_deleted: 0 },
      });
      timelines.set(sid, []);
      pushLog(sid, { ts: msg.ts, kind: "system", text: msg.payload.external ? "外部会话接入 (hooks)" : "会话创建" });
      break;
    }
    case "SESSION_UPDATED": {
      const s = sessions.get(sid); if (!s) break;
      s.status = msg.payload.status;
      s.action_summary = msg.payload.action_summary;
      if (msg.payload.stats) s.stats = msg.payload.stats;
      if (msg.payload.remote_mode !== undefined) s.remote_mode = msg.payload.remote_mode;
      if (msg.payload.title) s.title = msg.payload.title;
      if (msg.payload.turn_started_at) s.turn_started_at = msg.payload.turn_started_at;
      s.updated_at = msg.ts;
      break;
    }
    case "SESSION_HEARTBEAT": {
      const s = sessions.get(sid); if (!s) break;
      s.elapsed_hint = msg.payload.elapsed_ms;
      break;
    }
    case "SESSION_WAITING": {
      const s = sessions.get(sid); if (!s) break;
      s.status = "WAITING";
      s.waiting_request = { ...msg.payload, received_at: msg.ts };
      notifyWaiting(s, msg.payload);
      break;
    }
    case "SESSION_WAITING_RESOLVED": {
      const s = sessions.get(sid); if (!s) break;
      s.status = "WORKING";
      s.waiting_request = null;
      const d = msg.payload.decision;
      const dText = d === "allow" ? "已允许" : d === "deny" ? "已拒绝" : "远程审批超时，回退本地";
      pushLog(sid, { ts: msg.ts, kind: "system", text: dText + (d === "timeout" ? "" : " (by " + msg.payload.by + ")") });
      break;
    }
    case "SESSION_ERROR": {
      const s = sessions.get(sid); if (!s) break;
      s.status = "ERROR"; s.last_error = msg.payload.message;
      pushLog(sid, { ts: msg.ts, kind: "system", text: "错误: " + msg.payload.message });
      break;
    }
    case "SESSION_DONE": {
      const s = sessions.get(sid); if (!s) break;
      s.status = "DONE"; s.done_reason = msg.payload.terminal_reason;
      s.duration_ms = msg.payload.duration_ms;
      if (msg.payload.stats) s.stats = msg.payload.stats;
      pushLog(sid, { ts: msg.ts, kind: "system", text: "完成: " + msg.payload.terminal_reason + " · " + (msg.payload.duration_ms / 1000).toFixed(1) + "s" });
      break;
    }
    case "SESSION_DELETED": {
      sessions.delete(sid);
      break;
    }
    case "SESSION_LOG": {
      pushLog(sid, msg.payload);
      break;
    }
  }
  render();
}
function pushLog(sid, entry) {
  if (!timelines.has(sid)) timelines.set(sid, []);
  const list = timelines.get(sid);
  list.push({ ts: entry.ts || Date.now(), kind: entry.kind, text: entry.text, tool: entry.tool });
  if (list.length > 300) list.splice(0, list.length - 300);
}
function notifyWaiting(s, p) {
  if (p.decidable === false) return;
  buzz([90, 60, 90]);
  try {
    if (document.hidden && "Notification" in window && Notification.permission === "granted") {
      const n = new Notification("等待确认: " + (s.title || "会话"), {
        body: p.tool_name + " — " + (p.input_summary || "").slice(0, 80),
        tag: "ccr-wait-" + s.session_id,
      });
      n.onclick = () => { window.focus(); select(s.session_id); n.close(); };
    }
  } catch {}
}

// ---------- 渲染：列表 ----------
function fmtElapsed(ms) {
  if (!ms || ms < 0) ms = 0;
  const sec = Math.floor(ms / 1000);
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.floor(sec / 60) + "m" + String(sec % 60).padStart(2, "0") + "s";
  return Math.floor(sec / 3600) + "h" + String(Math.floor((sec % 3600) / 60)).padStart(2, "0") + "m";
}
function sessionElapsed(s) {
  if (s.status === "DONE" && s.duration_ms) return s.duration_ms;
  if (s.historical || s.status === "ERROR") return s.updated_at - s.started_at;
  return Date.now() - s.started_at;
}
function statsText(st) {
  if (!st || st.files_changed === 0) return "";
  return st.files_changed + " 文件 · +" + st.lines_added + " -" + st.lines_deleted;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function render() {
  let running = 0, waiting = 0;
  for (const s of sessions.values()) {
    if (s.status === "WORKING") running++;
    else if (s.status === "WAITING") waiting++;
  }
  $("runhint").textContent = !connected && sessions.size === 0 ? "等待连接"
    : waiting > 0 ? "⚠ " + waiting + " 个会话等待确认"
    : running > 0 ? running + " 个会话运行中"
    : sessions.size > 0 ? "共 " + sessions.size + " 个会话" : "暂无会话";

  const order = { WAITING: 0, WORKING: 1, ERROR: 2, DONE: 3 };
  const list = [...sessions.values()].sort((a, b) =>
    (order[a.status] ?? 9) - (order[b.status] ?? 9) || b.started_at - a.started_at);

  const box = $("list");
  if (list.length === 0) {
    box.innerHTML = '<div class="empty"><div class="big">⚡</div>还没有会话<br><span style="font-size:12px">点右下角 ＋ 在 PC 上启动新会话<br>或在 PC 上打开 claude 接入外部会话</span></div>';
  } else {
    box.innerHTML = list.map((s) => {
      const st = statsText(s.stats);
      return '<div class="card" onclick="select(\'' + s.session_id + '\')">' +
        '<div class="row1"><span class="dot ' + s.status + '"></span>' +
        '<span class="st ' + s.status + '">' + (STATUS[s.status]?.zh || s.status) + '</span>' +
        '<span class="elapsed">' + fmtElapsed(sessionElapsed(s)) + '</span></div>' +
        '<div class="ctitle">' + esc(s.title || "未命名会话") + '</div>' +
        '<div class="csum">' + esc(s.action_summary || "…") + '</div>' +
        '<div class="cfoot">' +
          (s.external ? '<span class="tag ext">外部 CLI</span>' : '<span class="tag">托管</span>') +
          (s.historical && !s.external ? '<span class="tag">历史</span>' : "") +
          '<span class="spacer"></span>' +
          (st ? '<span class="statsline"><span class="add">+' + s.stats.lines_added + '</span> <span class="del">-' + s.stats.lines_deleted + '</span></span>' : "") +
        "</div></div>";
    }).join("");
  }
  if (selected) renderDetail();
}

// ---------- 详情 ----------
function select(sid) { selected = sid; activeTab = "activity"; $("detail").classList.add("open"); renderDetail(); buzz(6); }
function closeDetail() { selected = null; $("detail").classList.remove("open"); }
function renderDetail() {
  const s = sessions.get(selected);
  if (!s) { closeDetail(); return; }
  $("dTitle").textContent = s.title || "未命名会话";
  $("dSub").innerHTML = (STATUS[s.status]?.zh || s.status) + " · " + (s.external ? "外部 CLI" : "托管") +
    (s.historical && !s.external ? " · 历史" : "") + " · " + fmtElapsed(sessionElapsed(s));

  // 审批横幅
  const wb = $("waitBanner");
  const wr = s.waiting_request;
  if (wr && wr.decidable !== false) {
    wb.classList.add("show");
    $("wTool").textContent = wr.tool_name || "?";
    $("wDesc").textContent = wr.input_summary || "";
  } else wb.classList.remove("show");

  // 命令栏可用性
  const canCmd = connected && !(s.historical && !s.external);
  $("msginput").disabled = !canCmd;
  $("sendBtn").disabled = !canCmd;
  $("msginput").placeholder = s.external
    ? "注入到终端（空闲时自动发送）"
    : (s.status === "DONE" ? "发送以继续对话…" : "发送消息…");

  const tabsHtml =
    '<div id="tabs">' +
    '<button class="tab ' + (activeTab === "activity" ? "on" : "") + '" onclick="setTab(\'activity\')">活动</button>' +
    '<button class="tab ' + (activeTab === "logs" ? "on" : "") + '" onclick="setTab(\'logs\')">日志</button>' +
    '<button class="tab ' + (activeTab === "stats" ? "on" : "") + '" onclick="setTab(\'stats\')">统计</button>' +
    "</div>";
  $("dContent").innerHTML = (s.historical && !s.external ? '<div class="histnote">Relay 重启前的历史会话，仅可查看</div>' : "") +
    tabsHtml + tabHtml(s);
  const dBody = $("dBody");
  if (activeTab === "logs") dBody.scrollTop = dBody.scrollHeight;
}
function setTab(t) { activeTab = t; buzz(5); renderDetail(); }

function tabHtml(s) {
  if (activeTab === "activity") {
    const ops = [];
    if (!s.external) {
      if (s.status === "WORKING") ops.push('<button class="op warn" onclick="stopSession()">■ 停止</button>');
    } else {
      if (s.status === "WORKING") ops.push('<button class="op warn" onclick="extStop()">■ 打断</button>');
      ops.push('<button class="op" onclick="extMode(' + (s.remote_mode ? "false" : "true") + ')">' +
        (s.remote_mode ? "关闭远程审批" : "开启远程审批") + "</button>");
    }
    return '<div class="ovcard"><div class="ovtop"><span class="dot ' + s.status + '"></span>' +
      '<span class="st ' + s.status + '">' + (STATUS[s.status]?.zh || s.status) + "</span></div>" +
      '<div class="ovrow"><span class="k">当前动作</span><span class="v">' + esc(s.action_summary || "—") + "</span></div>" +
      (s.status === "ERROR" && s.last_error ? '<div class="ovrow"><span class="k">错误</span><span class="v" style="color:var(--error)">' + esc(s.last_error) + "</span></div>" : "") +
      (s.status === "DONE" ? '<div class="ovrow"><span class="k">结束原因</span><span class="v">' + esc(s.done_reason || "—") + "</span></div>" : "") +
      "</div>" +
      (ops.length ? '<div class="ops">' + ops.join("") + "</div>" : "");
  }
  if (activeTab === "logs") {
    const tl = timelines.get(s.session_id) || [];
    if (tl.length === 0) return '<div class="empty" style="padding:40px">暂无日志</div>';
    return tl.map((e) => {
      const t = new Date(e.ts);
      const hh = String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
      return '<div class="tl-item"><span class="tl-time">' + hh + "</span>" +
        '<div class="tl-body">' + (e.tool ? '<div class="tl-tool">' + esc(e.tool) + "</div>" : "") +
        '<div class="tl-text ' + e.kind + '">' + esc(e.text) + "</div></div></div>";
    }).join("");
  }
  // stats
  const st = s.stats || { files_changed: 0, lines_added: 0, lines_deleted: 0 };
  return '<div class="ovcard">' +
    '<div class="ovrow"><span class="k">耗时</span><span class="v">' + fmtElapsed(sessionElapsed(s)) + "</span></div>" +
    '<div class="ovrow"><span class="k">改动文件</span><span class="v">' + st.files_changed + "</span></div>" +
    '<div class="ovrow"><span class="k">新增行</span><span class="v bigadd">+' + st.lines_added + "</span></div>" +
    '<div class="ovrow"><span class="k">删除行</span><span class="v" style="color:var(--error)">-' + st.lines_deleted + "</span></div>" +
    '<div class="ovrow"><span class="k">模型</span><span class="v">' + esc(s.model || "—") + "</span></div>" +
    '<div class="ovrow"><span class="k">开始时间</span><span class="v">' + fmtTime(s.started_at) + "</span></div>" +
    '<div class="ovrow"><span class="k">最近活动</span><span class="v">' + fmtTime(s.updated_at) + "</span></div>" +
    '<div class="ovrow"><span class="k">工作目录</span><span class="v" style="font-size:11.5px">' + esc(s.cwd) + "</span></div>" +
    (s.cli_pid ? '<div class="ovrow"><span class="k">CLI PID</span><span class="v">' + s.cli_pid + "</span></div>" : "") +
    "</div>";
}
function fmtTime(ts) {
  if (!ts) return "—";
  const t = new Date(ts);
  return String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") + ":" + String(t.getSeconds()).padStart(2, "0");
}

// ---------- 命令 ----------
function decide(allow) {
  const s = sessions.get(selected); if (!s || !s.waiting_request) return;
  buzz(12);
  const ok = sendCommand(allow ? "COMMAND_CONTINUE" : "COMMAND_REJECT",
    { session_id: s.session_id, request_id: s.waiting_request.request_id });
  if (ok && !allow) { /* reject 需要理由可选 */ }
}
function stopSession() {
  const s = sessions.get(selected); if (!s) return;
  buzz(15);
  sendCommand("COMMAND_STOP", { session_id: s.session_id });
}
function extStop() {
  const s = sessions.get(selected); if (!s) return;
  buzz(15);
  sendCommand("COMMAND_EXT_STOP", { session_id: s.session_id });
}
function extMode(on) {
  const s = sessions.get(selected); if (!s) return;
  buzz(10);
  sendCommand("COMMAND_EXT_MODE", { session_id: s.session_id, enabled: on });
}
function sendMsg() {
  const s = sessions.get(selected); if (!s) return;
  const input = $("msginput");
  const text = input.value.trim();
  if (!text) return;
  const ok = sendCommand(s.external ? "COMMAND_EXT_INPUT" : "COMMAND_MESSAGE",
    { session_id: s.session_id, text });
  if (ok) { input.value = ""; input.style.height = "auto"; buzz(10); }
}
$("msginput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
});
$("msginput").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 110) + "px";
});

// ---------- 新建 ----------
function openSheet() {
  if (!connected) { toast("未连接"); openSetup(); return; }
  $("cwdInput").value = localStorage.getItem("ccr_cwd") || "";
  $("sheetWrap").classList.add("open");
  buzz(8);
}
function closeSheet() { $("sheetWrap").classList.remove("open"); }
function createSession() {
  const cwd = $("cwdInput").value.trim();
  const prompt = $("promptInput").value.trim();
  if (!cwd) { toast("请填写工作目录"); return; }
  if (!prompt) { toast("请填写任务提示词"); return; }
  localStorage.setItem("ccr_cwd", cwd);
  if (sendCommand("COMMAND_CREATE", { cwd, prompt })) { closeSheet(); $("promptInput").value = ""; }
}

// ---------- 设置 ----------
function openSetup() {
  const { base, token } = wsUrl();
  $("suUrl").value = base || "";
  $("suToken").value = token || "";
  $("setup").classList.add("open");
}
function saveSetup() {
  const base = $("suUrl").value.trim().replace(/\/+$/, "");
  const token = $("suToken").value.trim();
  if (!base || !token) { toast("请填写完整"); return; }
  if (!/^wss?:\/\//.test(base)) { toast("地址需以 ws:// 或 wss:// 开头"); return; }
  localStorage.setItem("ccr_ws", base);
  localStorage.setItem("ccr_token", token);
  $("setup").classList.remove("open");
  lastSeq = 0;
  connect();
}

// ---------- 通知权限 ----------
function askNotify() {
  try {
    if ("Notification" in window && Notification.permission === "default") {
      const un = () => { if (Notification.permission === "default") Notification.requestPermission(); window.removeEventListener("visibilitychange", un); };
      window.addEventListener("visibilitychange", un);
    }
  } catch {}
}

// ---------- PWA / SW ----------
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

// ---------- 启动 ----------
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
setInterval(() => { render(); }, 10000);  // 耗时 ticker
askNotify();
connect();
</script>
</body>
</html>
