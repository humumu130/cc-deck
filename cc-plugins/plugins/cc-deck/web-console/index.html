<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050B12">
<title>CC Deck</title>
<!-- PWA：全部相对引用，/ 与 /m（手机重定向路径）下均解析到站点根 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CC Deck">
<style>
  :root {
    --bg: #050B12;
    --bg-soft: #07101A;
    --panel: #0B141F;
    --panel-2: #101B2B;
    --border: #1B2739;
    --text: #E8EDF5;
    --dim: #7E8BA3;
    --faint: #55617A;
    --brand: #D97757;
    --brand-2: #C96442;
    --send-btn: #D97757;
    --grad: linear-gradient(135deg, #E8985F, #C96442);
    --working: #FFC53D;
    --waiting: #F0524F;
    --error: #FF7849;
    --done: #2BD98F;
    --mono: Consolas, "Cascadia Mono", "JetBrains Mono", monospace;
    --glass: rgba(9,15,25,.8);
    --glass-soft: rgba(9,15,25,.55);
    --side-bg: rgba(8,13,22,.5);
    --code-bg: rgba(148,163,190,.14);
    --mdcode-bg: rgba(148,163,190,.07);
    --th-bg: rgba(148,163,190,.12);
    --toast-bg: #1A2334;
    --toast-shadow: 0 6px 24px rgba(0,0,0,.5);
    --scroll: #1E2B42;
    --hov: #33436B;
    --hov2: #2C3D63;
    --on-accent: #0B141F;
  }
  html.light {
    --bg: #F3F5F9;
    --bg-soft: #EAEEF4;
    --panel: #FFFFFF;
    --panel-2: #F1F4F9;
    --border: #D9DFE9;
    --text: #1C2637;
    --dim: #5F6C84;
    --faint: #8D99AE;
    --brand: #C2603E;
    --brand-2: #A04E30;
    --send-btn: #2F7FE8;
    --working: #A16207;
    --waiting: #DC2626;
    --error: #C2410C;
    --done: #047857;
    --glass: rgba(255,255,255,.82);
    --glass-soft: rgba(255,255,255,.6);
    --side-bg: rgba(238,242,248,.55);
    --code-bg: rgba(100,116,139,.14);
    --mdcode-bg: rgba(100,116,139,.06);
    --th-bg: rgba(100,116,139,.10);
    --toast-bg: #FFFFFF;
    --toast-shadow: 0 6px 24px rgba(15,23,42,.16);
    --scroll: #C3CBD9;
    --hov: #B9C4D6;
    --hov2: #B4C0D4;
    --on-accent: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(217,119,87,.08), transparent 60%),
      radial-gradient(900px 400px at -10% 110%, rgba(201,100,66,.05), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.55 "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  /* ---------- 顶栏（窄条，置于侧栏顶部，会话区顶到视口顶） ---------- */
  header {
    display: flex; align-items: center; gap: 9px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    background: var(--glass); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .logo {
    width: 31px; height: 31px; border-radius: 10px;
    background: linear-gradient(180deg, #2B2433, #161221);
    border: 1px solid rgba(255,255,255,.09);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06); flex: none;
  }
  .logo svg { width: 19px; height: 19px; }
  #empty .logo svg { width: 30px; height: 30px; }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand h1 { font-size: 15px; font-weight: 700; letter-spacing: .3px; white-space: nowrap; }
  #runhint { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
  header .spacer { flex: 1; }

  #connChip {
    display: flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: var(--dim);
    padding: 4px 9px; border: 1px solid var(--border); border-radius: 999px;
    cursor: pointer; white-space: nowrap; max-width: 128px; overflow: hidden; text-overflow: ellipsis;
  }
  /* 折叠指示箭头：提示可点开连接面板 */
  #connChip::after { content: "▸"; color: var(--faint); flex: none; }
  #connChip.open::after { content: "▾"; }
  #connChip i { width: 8px; height: 8px; border-radius: 50%; background: var(--error); flex: none; }
  #connChip.on i { background: var(--done); }
  #connChip.wait i { background: var(--working); --sc: var(--working); animation: dot-breathe 2.4s ease-in-out infinite; }

  button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; font-family: inherit;
    transition: border-color .15s, background .15s, transform .05s;
  }
  button:hover { border-color: var(--hov); }
  button:active { transform: scale(.97); }
  button.primary { background: var(--grad); border: none; color: #fff; font-weight: 600; box-shadow: 0 2px 12px rgba(217,119,87,.3); }
  button.allow { background: rgba(43,217,143,.12); border: 1px solid rgba(43,217,143,.5); color: var(--done); font-weight: 600; }
  button.allow:hover { background: rgba(43,217,143,.22); }
  button.reject { background: rgba(240,82,79,.10); border: 1px solid rgba(240,82,79,.5); color: var(--error); font-weight: 600; }
  button.reject:hover { background: rgba(240,82,79,.2); }
  button.ghost { background: transparent; }
  button.big { padding: 10px 22px; font-size: 14px; border-radius: 12px; }

  input, textarea {
    background: var(--bg-soft); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: inherit;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(217,119,87,.15); }
  input::placeholder, textarea::placeholder { color: var(--faint); }

  /* ---------- 折叠面板（连接） ---------- */
  .panel {
    display: none; flex-direction: column; gap: 9px;
    padding: 12px 16px 13px; background: var(--bg-soft); border-bottom: 1px solid var(--border); flex: none;
  }
  .panel.open { display: flex; }
  /* 连接表单：五行纵排（类型/名称/地址/token/动作），前四行左对齐，动作行靠右 */
  .conn-form { display: flex; flex-direction: column; gap: 9px; align-items: flex-start; }
  .conn-form input { width: 100%; align-self: stretch; }
  .conn-actions { display: flex; gap: 8px; margin-left: auto; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel-2); flex: none; }
  .seg button { border: none; border-radius: 0; padding: 7px 13px; background: transparent; color: var(--dim); font-size: 12.5px; font-weight: 500; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--grad); color: #fff; font-weight: 600; }
  #pairBox { display: none; align-items: center; gap: 8px; }
  #pairBox input { width: 150px; letter-spacing: 3px; font-size: 15px; text-align: center; }
  .pair-hint { font-size: 11.5px; color: var(--dim); }
  .pair-hint b { color: var(--text); font-weight: 600; }

  /* ---------- 服务器管理列表（多源） ---------- */
  #srvList { display: flex; flex-direction: column; gap: 7px; }
  .srv-row {
    display: flex; align-items: center; gap: 9px; padding: 8px 9px 8px 11px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--panel);
    cursor: pointer; transition: border-color .15s, box-shadow .15s;
  }
  .srv-row:hover { border-color: var(--hov); }
  .srv-row.active { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .srv-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); flex: none; --sc: var(--error); }
  .srv-row .dot.online { background: var(--done); --sc: var(--done); }
  .srv-row .dot.connecting { background: var(--working); --sc: var(--working); animation: dot-breathe 2.4s ease-in-out infinite; }
  .srv-main { flex: 1; min-width: 0; }
  .srv-main b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srv-addr { display: block; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srv-row .srv-edit, .srv-row .srv-del {
    flex: none; background: none; border: none; cursor: pointer; color: var(--faint);
    font-size: 12px; padding: 4px 5px; border-radius: 7px; opacity: 0; transition: opacity .12s;
  }
  .srv-row:hover .srv-edit, .srv-row:hover .srv-del, .srv-row .srv-edit:focus, .srv-row .srv-del:focus { opacity: 1; }
  .srv-row .srv-edit:hover { color: var(--dim); background: var(--bg-soft); }
  .srv-row .srv-del:hover { color: var(--error); background: var(--bg-soft); }

  /* ---------- 源过滤 chips + 卡片源角标 ---------- */
  #srcChips { display: none; flex-wrap: wrap; gap: 6px; padding: 0 16px 4px; }
  #srcChips button {
    font-size: 11.5px; padding: 3px 10px; border-radius: 999px; color: var(--dim);
    display: inline-flex; align-items: center; gap: 5px; max-width: 150px;
  }
  #srcChips button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #srcChips button.on { color: var(--text); border-color: rgba(217,119,87,.6); background: rgba(217,119,87,.12); }
  #srcChips button i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .src-badge {
    display: inline-flex; align-items: center; gap: 4px; flex: none;
    font-size: 10.5px; font-weight: 500; color: var(--dim);
    border: 1px solid var(--border); padding: 1px 7px; border-radius: 999px;
  }
  .src-badge i { width: 7px; height: 7px; border-radius: 50%; }

  /* ---------- 主体 ---------- */
  main { flex: 1; display: flex; overflow: hidden; }
  #side {
    width: 380px; flex: none; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--side-bg);
  }
  #side h3 {
    font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: var(--faint);
    text-transform: uppercase; padding: 10px 16px 4px;
  }
  #cards { flex: 1; overflow-y: auto; padding: 4px 14px 10px; display: flex; flex-direction: column; gap: 10px; }

  /* 侧栏底部：新建会话（表单 + 按钮，风格贴合会话卡片） */
  #newbox { flex: none; border-top: 1px solid var(--border); padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); background: var(--side-bg); }
  #newform { display: none; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  #newform.open { display: flex; }
  #newform textarea { resize: vertical; min-height: 56px; }
  #newform .row { display: flex; justify-content: flex-end; gap: 8px; }
  #addBtn {
    width: 100%; padding: 10px; border-radius: 14px;
    border: 1px dashed var(--border); background: transparent; color: var(--dim);
    font-weight: 600; font-size: 13px;
  }
  #addBtn:hover { color: var(--brand); border-color: rgba(217,119,87,.6); background: transparent; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 13px 15px; cursor: pointer; position: relative;
    transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  .card:hover { border-color: var(--hov2); }
  .card.sel { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), 0 4px 20px rgba(217,119,87,.15); }
  .card.historical { opacity: .75; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .elapsed { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .card-title { font-size: 15px; font-weight: 650; margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .his-badge {
    font-size: 10px; color: var(--faint); border: 1px solid var(--border);
    padding: 1px 7px; border-radius: 999px; flex: none; font-weight: 500;
  }
  .his-badge.ext { color: var(--brand-2); border-color: rgba(201,100,66,.4); }
  .card-edit {
    margin-left: auto; flex: none; background: none; border: none; cursor: pointer;
    color: var(--faint); font-size: 12px; padding: 2px 4px; border-radius: 6px; opacity: 0;
    transition: opacity .12s;
  }
  .card:hover .card-edit { opacity: 1; }
  .card-edit:hover { color: var(--dim); background: var(--bg-soft); }
  .card-title input {
    flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; padding: 3px 8px; border-radius: 7px;
  }

  /* ---------- 任务面板（详情页"任务" tab） ---------- */
  .todo-head { display: flex; align-items: center; gap: 10px; padding: 16px 4px 6px; }
  .todo-bar { flex: 1; height: 5px; border-radius: 3px; background: var(--bg-soft); overflow: hidden; }
  .todo-bar i { display: block; height: 100%; border-radius: 3px; background: var(--done); transition: width .3s; }
  .todo-pct { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .todo-head button { font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .todo-group { margin: 10px 0 16px; }
  .todo-gt { font-size: 11px; letter-spacing: 1.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }
  .todo-gt.ip { color: var(--working); border-bottom-color: rgba(255,197,61,.25); }
  .todo-gt.dn { color: var(--done); border-bottom-color: rgba(43,217,143,.22); }
  .todo-item { display: flex; align-items: flex-start; gap: 9px; padding: 7px 2px; font-size: 13.5px; line-height: 1.5; }
  .todo-ck { flex: none; width: 16px; text-align: center; font-size: 12px; padding-top: 1px; }
  .todo-item.in_progress .todo-ck { color: var(--working); }
  .todo-item.completed .todo-ck { color: var(--done); }
  .todo-item.pending .todo-ck { color: var(--faint); }
  .todo-item.completed .todo-tx { color: var(--faint); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.22); }
  .todo-item.in_progress .todo-tx { color: var(--text); }
  .todo-item.pending .todo-tx { color: var(--dim); }
  .todo-empty { color: var(--faint); padding: 60px 4px; text-align: center; font-size: 13px; }
  /* ---------- 定时任务（详情页"定时" tab） ---------- */
  .cron-item { display: flex; align-items: flex-start; gap: 9px; padding: 9px 2px; border-bottom: 1px solid var(--border); }
  .cron-item:last-child { border-bottom: none; }
  .cron-mark { flex: none; color: var(--working); font-size: 13px; padding-top: 1px; }
  .cron-item.paused .cron-mark { color: var(--faint); }
  .cron-main { flex: 1; min-width: 0; }
  .cron-name { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cron-item.paused .cron-name { color: var(--dim); font-weight: 500; }
  .cron-meta { font-size: 11.5px; color: var(--faint); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .card-summary { color: var(--dim); font-size: 12.5px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-summary.waiting { color: var(--working); }
  .card-stats { font-size: 12px; color: var(--faint); margin-top: 6px; display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
  .card-stats .add { color: var(--done); }
  .card-stats .del { color: var(--error); }
  .card-cta { margin-top: 10px; display: flex; justify-content: flex-end; }
  .card-cta button {
    background: rgba(245,184,65,.12); border: 1px solid rgba(245,184,65,.45); color: var(--working);
    font-weight: 600; border-radius: 999px; padding: 5px 18px;
  }
  .card-cta button:hover { background: rgba(245,184,65,.22); }

  .status-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    color: var(--sc, var(--dim));
  }
  .status-chip i { width: 11px; height: 11px; border-radius: 50%; background: var(--sc, var(--dim)); flex: none; }
  .status-chip.s-WORKING { --sc: var(--working); }
  .status-chip.s-WAITING { --sc: var(--waiting); }
  .status-chip.s-ERROR   { --sc: var(--error); }
  .status-chip.s-DONE    { --sc: var(--done); }
  .status-chip.s-WORKING i { animation: dot-breathe 2.4s ease-in-out infinite; }
  @keyframes dot-breathe {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 2px 0 color-mix(in srgb, var(--sc) 40%, transparent); }
    50% { opacity: .45; transform: scale(.8); box-shadow: 0 0 9px 2px color-mix(in srgb, var(--sc) 55%, transparent); }
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sc) 45%, transparent); }
    50% { box-shadow: 0 0 9px 2px color-mix(in srgb, var(--sc) 55%, transparent); }
  }

  /* ---------- 详情 ---------- */
  #detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #dhead { padding: 12px 20px 0; border-bottom: 1px solid var(--border); background: var(--glass-soft); flex: none; }
  #backBtn { display: none; margin-left: -8px; margin-bottom: 6px; }
  .dhead-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #dtitle { font-size: 17px; font-weight: 700; }
  #renameBtn { padding: 3px 9px; font-size: 13px; color: var(--dim); }
  #dsub { color: var(--dim); font-size: 12px; margin-top: 5px; display: flex; gap: 12px; flex-wrap: wrap; }
  #dsub .elapsed { color: var(--text); }
  /* 上下文占用条（详情副行）：标签 + 3px 细条 + 百分比，颜色按占用分级（与手机端同口径） */
  #dsub .dctx { display: inline-flex; align-items: center; gap: 6px; }
  #dsub .dctx .lbl { color: var(--faint); font-size: 10px; }
  #dsub .dctx .bar { width: 90px; height: 3px; border-radius: 1.5px; background: rgba(128,134,148,.28); overflow: hidden; }
  #dsub .dctx .bar i { display: block; height: 100%; border-radius: 1.5px; }
  #dsub .dctx .t { font-size: 11px; font-variant-numeric: tabular-nums; }
  .card-stats .ctx-mini { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }
  .card-stats .ctx-mini-bar { width: 30px; height: 3px; border-radius: 1.5px; background: rgba(128,134,148,.28); overflow: hidden; }
  .card-stats .ctx-mini-bar i { display: block; height: 100%; border-radius: 1.5px; }
  .card-stats .ctx-mini-t { font-size: 10px; font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 2px; margin-top: 10px; align-items: center; }
  .tabs .spacer { flex: 1; }
  .tabs button.tab {
    background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 0;
    color: var(--dim); padding: 8px 16px; font-size: 13px; font-weight: 600;
  }
  .tabs button.tab.active { color: var(--text); border-bottom-color: var(--brand); }
  .tabs button.mini {
    font-size: 11.5px; padding: 5px 11px; border-radius: 999px; color: var(--dim);
    border: 1px dashed var(--border); background: transparent;
  }
  .tabs button.mini.on { color: var(--brand); border-color: rgba(217,119,87,.55); border-style: solid; }

  /* 工作状态行（类 CLI，置于输入卡上方）：✶ 摘要 · 回合耗时；宽度与时间线会话列对齐 */
  #liverow {
    display: none; align-items: center; gap: 8px;
    margin: 10px auto 10px; width: calc(100% - 40px); max-width: min(1040px, 100%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 12px; font-size: 12.5px; flex: none;
  }
  #liverow .spin { display: inline-block; color: var(--working); animation: rot 1.8s linear infinite; font-weight: 700; }
  @keyframes rot { to { transform: rotate(360deg); } }
  #liverow .sum { flex: 1; color: var(--working); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #liverow .el { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11.5px; }

  #waitbox {
    margin: 12px auto 0; width: calc(100% - 40px); max-width: min(1040px, 100%);
    background: rgba(245,184,65,.07);
    border: 1px solid rgba(245,184,65,.4); border-radius: 14px; padding: 14px 16px; display: none;
    flex: none;
  }
  #waitbox .t { color: var(--working); font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  #waitbox .t i { width: 9px; height: 9px; border-radius: 50%; background: var(--working); animation: breathe 1.6s infinite; --sc: var(--working); }
  #waitdetail { margin-top: 7px; font-size: 13px; word-break: break-all; }
  #waitelapsed { color: var(--faint); font-size: 12px; margin-top: 5px; }
  #waitbox .cmds { margin-top: 11px; display: flex; gap: 10px; }
  #questions { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
  .q-item .q-text { font-size: 13px; font-weight: 600; }
  .q-item .q-header { font-size: 11px; color: var(--brand-2); letter-spacing: 1px; margin-bottom: 2px; }
  .q-opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; }
  .q-opts button { font-size: 12.5px; }
  .q-opts button.sel { background: var(--grad); border: none; color: #fff; font-weight: 600; }
  .q-opts button .d { display: block; font-size: 11px; color: var(--dim); font-weight: 400; max-width: 260px; text-align: left; }
  .q-opts button.sel .d { color: rgba(255,255,255,.75); }
  .q-free { margin-top: 7px; width: 100%; }
  .q-foot { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  #askCancel { background: none; border: none; color: var(--faint); font-size: 11.5px; padding: 4px 6px; text-decoration: underline dotted; }

  /* ---------- 时间线（聊天式，与手机端转录对齐） ---------- */
  /* 阅读体验：正文 15px×字号档 + 1.75 行高 + 阅读列宽（宽屏行长控制） */
  #timeline {
    flex: 1; overflow-y: auto; padding: 14px 22px 20px;
    font-size: calc(15px * var(--tl-scale, 1)); line-height: 1.75; letter-spacing: .012em;
  }
  #timeline > * { max-width: min(1040px, 100%); margin-left: auto; margin-right: auto; }
  .day-sep { text-align: center; color: var(--faint); font-size: 10.5px; margin: 14px 0 4px; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .msg-user { display: flex; flex-direction: column; align-items: flex-end; margin: 18px 0; }
  .msg-user .ub {
    max-width: 82%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 14px; border-top-right-radius: 5px; padding: 10px 15px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-user .mt { color: var(--faint); font-size: 10.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  /* AI 消息：无气泡，头像 + 名称行（WorkBuddy 式），正文直接排版 */
  .msg-ai { margin: 18px 0; }
  .msg-ai .ai-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
  .msg-ai .ai-ava {
    width: 28px; height: 28px; border-radius: 50%; background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; flex: none;
    box-shadow: 0 1px 8px rgba(217,119,87,.3);
  }
  .msg-ai .ai-name { font-weight: 650; font-size: 13.5px; }
  .msg-ai .ai-body { padding-left: 37px; min-width: 0; }
  .msg-ai .mt { color: var(--faint); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .msg-sys { text-align: center; color: var(--faint); font-size: .8em; margin: 10px 0; }
  /* 思考过程：折叠卡（默认收起，与手机端一致） */
  .think {
    margin: 8px 0; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 12px; font-size: .85em; opacity: .85;
  }
  .think .th-head { color: var(--faint); font-weight: 600; cursor: pointer; font-size: 11.5px; user-select: none; }
  .think .th-head:hover { color: var(--dim); }
  .think .th-body { margin-top: 7px; color: var(--dim); }
  /* 工具行（过程消息：轻量行式，WorkBuddy 风格：图标 + 名称 + 摘要 + 折叠） */
  .trow { margin: 5px 0; font-size: .8em; opacity: .88; }
  .tline {
    display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
    color: var(--dim); border-radius: 8px; padding: 3px 7px; margin-left: -7px;
  }
  .tline:hover { background: var(--code-bg); }
  .tline .tico { flex: none; color: var(--faint); }
  .tline .tname { font-weight: 600; }
  .tname { color: var(--brand-2); font-weight: 700; }
  .tres { color: var(--faint); }
  .ds-add { color: var(--done); font-family: var(--mono); font-size: .95em; }
  .ds-del { color: var(--error); font-family: var(--mono); font-size: .95em; }
  .tdetail {
    font-family: var(--mono); font-size: .78em; line-height: 1.55; color: var(--dim); letter-spacing: 0;
    white-space: pre-wrap; word-break: break-all; margin: 4px 0 2px; max-height: 360px; overflow: auto;
    background: var(--mdcode-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  .diff { margin-top: 5px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .diff div { font-family: var(--mono); font-size: .76em; line-height: 1.55; padding: 0 8px; white-space: pre; letter-spacing: 0; }
  .diff .a { color: var(--done); background: rgba(43,217,143,.07); }
  .diff .d { color: var(--waiting); background: rgba(240,82,79,.06); }
  .diff .h { color: var(--working); background: rgba(255,197,61,.06); }
  .diff .c { color: var(--faint); }
  .x-full { color: var(--brand); font-size: .78em; cursor: pointer; display: inline-block; user-select: none; }
  .msg-ai .x-full { margin: 7px 0 0 2px; }
  .x-full:hover { text-decoration: underline; }
  .stream-cur { color: var(--working); animation: blinkcur 1s infinite; font-weight: 700; }
  @keyframes blinkcur { 50% { opacity: .15; } }
  /* 排队注入消息（外部会话）：右对齐呼吸气泡 */
  #pendbox { display: none; flex-direction: column; align-items: flex-end; gap: 6px; padding: 0 20px 8px; flex: none; width: 100%; max-width: min(1040px, 100%); margin: 0 auto; box-sizing: border-box; }
  #pendbox span {
    background: var(--panel-2); border: 1px dashed var(--border); color: var(--dim);
    border-radius: 12px; border-top-right-radius: 4px; padding: 6px 11px; font-size: 12px;
    max-width: 70%; animation: pendpulse 1.8s infinite;
  }
  @keyframes pendpulse { 50% { opacity: .45; } }
  /* 子 Agent 工作状态 */
  #agbox {
    display: none; margin: 10px auto 0; width: calc(100% - 40px); max-width: min(1040px, 100%);
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 7px 12px; flex: none;
  }
  .agrow { display: flex; gap: 10px; align-items: baseline; font-size: 12px; padding: 3px 0; }
  .agrow .ad { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agrow .at { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  /* 轻量 Markdown（assistant_text/thinking，与手机端 md.tsx 同构）。
     assistant 正文无卡片直接排版（WorkBuddy 式，靠头像行区分发言者）；字号随时间线档位缩放 */
  .ai-body > .txt.md { min-width: 0; }
  .ai-body > .txt.md > :first-child { margin-top: 0; }
  .ai-body > .txt.md > :last-child { margin-bottom: 0; }
  .md-p { white-space: pre-wrap; margin: 9px 0; }
  .md-h1, .md-h2, .md-h3, .md-h4 { font-weight: 700; margin: 15px 0 6px; }
  .md-h1 { font-size: 1.18em; } .md-h2 { font-size: 1.1em; } .md-h3 { font-size: 1.03em; } .md-h4 { font-size: 1em; }
  .txt.md code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: .88em; letter-spacing: 0; }
  .md-code { background: var(--mdcode-bg); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin: 10px 0; overflow-x: auto; white-space: pre; font-family: var(--mono); font-size: .86em; line-height: 1.6; letter-spacing: 0; }
  .md-li { margin: 5px 0; white-space: pre-wrap; }
  .md-bul { color: var(--faint); }
  .md-quote { border-left: 3px solid var(--brand); padding: 3px 12px; color: var(--faint); margin: 9px 0; }
  .md-hr { border-top: 1px solid var(--border); margin: 10px 0; }
  .md-table-wrap { overflow-x: auto; margin: 10px 0; max-width: 100%; }
  table.md-table { border-collapse: collapse; font-size: .88em; letter-spacing: 0; }
  .md-table th, .md-table td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; vertical-align: top; word-break: break-word; max-width: 360px; white-space: normal; }
  .md-table th { background: var(--th-bg); font-weight: 600; }

  .stats-card { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-top: 8px; }
  .stats-row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .stats-row:last-child { border-bottom: none; }
  .stats-row .k { color: var(--dim); flex: none; }
  .stats-row .v { text-align: right; word-break: break-all; font-variant-numeric: tabular-nums; }

  /* ---------- 输入卡（WorkBuddy 式：卡片内嵌 + 图标行 + 底部功能行 + 纸飞机） ---------- */
  #cmdbar {
    padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); background: var(--glass); flex: none;
    position: relative;
  }
  #cmdbar > * { width: 100%; max-width: min(1040px, 100%); margin: 0 auto; }
  #inputcard {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 7px 10px 8px 12px; transition: border-color .15s, box-shadow .15s;
  }
  #inputcard:focus-within {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(217,119,87,.13), 0 2px 18px rgba(217,119,87,.08);
  }
  #inputcard .ic-top { display: flex; align-items: flex-start; gap: 8px; }
  #inputcard .ic-at { color: var(--faint); font-weight: 700; font-size: 15px; line-height: 30px; flex: none; cursor: pointer; user-select: none; }
  #inputcard .ic-at:hover { color: var(--dim); }
  #msginput {
    flex: 1; background: none; border: none; box-shadow: none; resize: none;
    padding: 6px 2px; font-size: 14px; line-height: 1.6; min-height: 30px; max-height: 170px;
    border-radius: 0;
  }
  #msginput:focus { border: none; box-shadow: none; }
  #inputcard .ic-bottom { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  /* Slash 命令联想：输入 / 时浮在输入卡上方 */
  #slashbox {
    display: none; position: absolute; bottom: calc(12px + env(safe-area-inset-bottom));
    left: 20px; right: 20px; margin: 0 auto; max-width: min(1040px, calc(100% - 40px));
    max-height: 248px; overflow-y: auto; z-index: 30;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 8px 28px rgba(0,0,0,.4);
  }
  #slashbox .sl-row {
    display: flex; align-items: center; gap: 9px; padding: 8px 13px;
    cursor: pointer; font-size: 13px;
  }
  #slashbox .sl-row:hover, #slashbox .sl-row.hot { background: var(--code-bg); }
  #slashbox .sl-name { font-weight: 600; color: var(--text); flex: none; }
  #slashbox .sl-desc { color: var(--faint); font-size: 11.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #slashbox .sl-src {
    flex: none; font-size: 10px; color: var(--dim); border: 1px solid var(--border);
    border-radius: 7px; padding: 1px 6px;
  }
  #slashbox .sl-empty { padding: 12px 13px; color: var(--faint); font-size: 12px; }
  #inputcard .ic-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  #stopBtn {
    display: none; border-radius: 999px; padding: 4px 13px; font-size: 12px; font-weight: 600;
    background: rgba(240,82,79,.1); border: 1px solid rgba(240,82,79,.4); color: var(--error);
    align-self: center; flex: none;
  }
  #stopBtn:hover { background: rgba(240,82,79,.18); border-color: rgba(240,82,79,.55); }
  #sendBtn {
    width: 34px; height: 34px; border-radius: 10px; padding: 0; border: none; flex: none;
    background: var(--send-btn); color: #fff; font-size: 17px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #sendBtn:hover:not(:disabled) { filter: brightness(1.1); }
  #sendBtn:disabled { opacity: .4; cursor: default; }
  #hisnote { display: none; padding: 14px 20px; border-top: 1px solid var(--border); color: var(--faint); font-size: 13px; background: var(--glass); flex: none; }

  #empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--faint); }
  #empty .logo { width: 52px; height: 52px; border-radius: 16px; font-size: 18px; }

  #toast {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(20px);
    background: var(--toast-bg); border: 1px solid var(--border); color: var(--text);
    padding: 9px 18px; border-radius: 10px; font-size: 13px; opacity: 0;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 99; max-width: 80vw;
    box-shadow: var(--toast-shadow);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 移动端 ---------- */
  @media (max-width: 720px) {
    header { padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
    #runhint { display: none; }
    #timeline { font-size: calc(14px * var(--tl-scale, 1)); }
    .brand h1 { font-size: 14px; }
    #cards { padding: 4px 10px 12px; }
    #srcChips { padding: 0 10px 4px; }
    .srv-row .srv-edit, .srv-row .srv-del { opacity: 1; }
    main { position: relative; }
    #side { width: 100%; border-right: none; }
    #detail {
      display: none; position: absolute; inset: 0; background: var(--bg);
      z-index: 5; padding-top: env(safe-area-inset-top);
    }
    body.detail-open #side { display: none; }
    body.detail-open #detail { display: flex; }
    body.detail-open #backBtn { display: inline-block; }
    #timeline, #dhead, #cmdbar, #hisnote { padding-left: 14px; padding-right: 14px; margin-left: 0; margin-right: 0; }
    #waitbox, #liverow, #agbox { margin-left: 14px; margin-right: 14px; width: calc(100% - 28px); }
    #pendbox { padding: 0 14px 8px; }
    #slashbox { left: 14px; right: 14px; max-width: calc(100% - 28px); }
  }
</style>
