<script>
"use strict";
const $ = (id) => document.getElementById(id);

// ---------- E2E（与 relay/src/e2e.ts 同构；nacl 由 /nacl.js 提供） ----------
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
function toB64(b) {
  let s = "";
  for (let i = 0; i < b.length; i += 3) {
    const b1 = b[i], b2 = i + 1 < b.length ? b[i + 1] : null, b3 = i + 2 < b.length ? b[i + 2] : null;
    s += B64[b1 >> 2] + B64[((b1 & 3) << 4) | (b2 === null ? 0 : b2 >> 4)];
    s += b2 === null ? "=" : B64[((b2 & 15) << 2) | (b3 === null ? 0 : b3 >> 6)];
    s += b3 === null ? "=" : B64[b3 & 63];
  }
  return s;
}
function fromB64(st) {
  const out = []; let bits = 0, acc = 0;
  for (const ch of st.replace(/=+$/, "")) {
    const v = B64.indexOf(ch);
    if (v < 0) throw new Error("bad base64");
    acc = (acc << 6) | v; bits += 6;
    if (bits >= 8) { bits -= 8; out.push((acc >> bits) & 0xff); }
  }
  return new Uint8Array(out);
}
function genKp() {
  const kp = nacl.box.keyPair();
  return { publicKey: toB64(kp.publicKey), secretKey: toB64(kp.secretKey) };
}
function devId(pk, prefix) {
  return prefix + "-" + [...fromB64(pk).slice(0, 8)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
function seal(obj, theirPk, mySk) {
  const nonce = nacl.randomBytes(nacl.box.nonceLength);
  const c = nacl.box(new TextEncoder().encode(JSON.stringify(obj)), nonce, fromB64(theirPk), fromB64(mySk));
  return { n: toB64(nonce), c: toB64(c) };
}
function unseal(box, theirPk, mySk) {
  const opened = nacl.box.open(fromB64(box.c), fromB64(box.n), fromB64(theirPk), fromB64(mySk));
  return opened ? JSON.parse(new TextDecoder().decode(opened)) : null;
}

// ---------- 状态 ----------
let selected = null;           // {src: serverId, sid: session_id}，选中会话按源寻址
let activeTab = "activity";
let thinkShown = false;        // 思考过程显示开关（与手机端一致，默认关）
const expanded = new Set();    // 展开状态（全文/思考/工具详情/diff），键 = e.id ?? ts|kind|len
let expandRev = 0;             // 展开变更计数（驱动时间线重建）
let filterSrc = "all";         // 会话列表按源过滤：all | serverId

// ---------- 多源服务器 ----------
// 持久化 ccd_servers：[{id, name, kind:"lan"|"cloud", wsUrl, token,
//   cloud:{url, token, rd, rk, paired}}]；lan 的 token = relay 令牌，
// cloud 的 token = 桥准入令牌，cloud.rd/rk = 对端 relay 身份（配对成功写回）。
// 输码配对兜底：rd/rk 非机密（dev 路由号 + 公开公钥），安全边界是 LAN 领取的一次性配对码。
// relay 换 data/cloud-keypair.json 后需同步更新烘焙值并重新部署。
const BAKED_RELAY = { rd: "rl-586b030b1e8b171b", rk: "WGsDCx6LFxuFsIPSrOoFJcyYcLiDKkTetYUTw4h07SE=" };
// 云桥准入 token 烘焙（用户免填）：默认公共桥 token（开源用户零配置）。
// 桥只转发密文不落盘，token 暴露面=能连桥发垃圾密文帧（relay 全丢弃），真正安全边界在配对码。
const BAKED_BRIDGE_TOKEN = "ccdeck-public-9f3k2m7v";
const BAKED_BRIDGE_URL = "wss://cc.humumu.online/cloud";
const SERVERS_KEY = "ccd_servers";
const ACTIVE_KEY = "ccd_active";
let servers = [];              // ServerEntry[]（持久化）
let activeServerId = "";       // 服务器列表点选的活动源（新建会话默认目标）
const ctxs = new Map();        // serverId -> 运行时连接上下文（每源独立状态机）

let ckp = null;                // 本浏览器固定 box 密钥对（跨源共用，localStorage ccr_cloud_kp）

function serverBridgeToken(cfg) { return cfg.token || BAKED_BRIDGE_TOKEN; }
function defaultCloudUrl() {
  return location.protocol.startsWith("http")
    ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/cloud"
    : BAKED_BRIDGE_URL;
}
function hostOf(u) { try { return new URL(String(u).replace(/^ws/i, "http")).host; } catch { return u || ""; } }
const cfgOf = (id) => servers.find((s) => s.id === id);

function saveServers() {
  try { localStorage.setItem(SERVERS_KEY, JSON.stringify(servers)); } catch {}
}
// Safari 无痕模式 setItem 抛 QuotaExceeded、getItem 极端环境也可能抛：
// 统一走安全封装，避免顶层脚本中断白板 / connectAll 循环被打断
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

// 旧单源配置（ccr_mode/ccr_url/ccr_token/ccr_cloud_*）→ 第一批 server 记录；
// 迁移后清旧键避免双计。ccr_cloud_kp 是浏览器 E2E 身份（跨源共用），保留。
function migrateLegacy() {
  let list = null;
  try { list = JSON.parse(localStorage.getItem(SERVERS_KEY) || "null"); } catch {}
  if (Array.isArray(list)) { servers = list.filter((e) => e && e.id && e.kind); return; }
  list = [];
  const mode = lsGet("ccr_mode");
  let peer = null;
  try { peer = JSON.parse(localStorage.getItem("ccr_cloud_peer") || "null"); } catch {}
  if (mode === "cloud") {
    const url = lsGet("ccr_cloud_url") || defaultCloudUrl();
    const token = lsGet("ccr_cloud_token") || BAKED_BRIDGE_TOKEN;
    list.push({
      id: uuid(), name: peer ? "云桥" : "公共桥（默认）", kind: "cloud", wsUrl: url, token,
      cloud: { url, token, rd: peer?.relay_dev || BAKED_RELAY.rd, rk: peer?.relay_pubkey || BAKED_RELAY.rk, paired: !!peer },
    });
  } else {
    const u = lsGet("ccr_url");
    if (u) list.push({ id: uuid(), name: hostOf(u), kind: "lan", wsUrl: u, token: lsGet("ccr_token") || "" });
    // LAN 模式但曾配对过云桥：配对身份不丢，附带一条已配对云源
    if (peer) {
      const url = lsGet("ccr_cloud_url") || defaultCloudUrl();
      const token = lsGet("ccr_cloud_token") || BAKED_BRIDGE_TOKEN;
      list.push({
        id: uuid(), name: "云桥", kind: "cloud", wsUrl: url, token,
        cloud: { url, token, rd: peer.relay_dev, rk: peer.relay_pubkey, paired: true },
      });
    }
  }
  if (!list.length) {
    // 首次使用：烘焙参数的默认公共桥 + 一条不自动连的直连占位
    const url = defaultCloudUrl();
    list.push({
      id: uuid(), name: "公共桥（默认）", kind: "cloud", wsUrl: url, token: BAKED_BRIDGE_TOKEN,
      cloud: { url, token: BAKED_BRIDGE_TOKEN, rd: BAKED_RELAY.rd, rk: BAKED_RELAY.rk, paired: false },
    });
    list.push({ id: uuid(), name: "本机直连", kind: "lan", wsUrl: "", token: "" });
  }
  servers = list;
  saveServers();
  for (const k of ["ccr_mode", "ccr_url", "ccr_token", "ccr_cloud_url", "ccr_cloud_token", "ccr_cloud_peer", "ccr_lastseq"]) {
    try { localStorage.removeItem(k); } catch {}
  }
}

// 每源运行时上下文：连接状态、会话/时间线/序号、云桥传输（ws/poll）、配对看门狗全部按源隔离
function ensureCtx(cfg) {
  let c = ctxs.get(cfg.id);
  if (!c) {
    c = {
      cfg, status: "offline", statusText: "未连接",
      sessions: new Map(), timelines: new Map(), lastSeq: 0,
      ws: null, reconnectDelay: 1000, reconnectTimer: 0,
      pendingPair: null, pairTimer: 0, pingTimer: null, lastPong: 0,
      transport: "ws", pollGen: 0, pollSid: "", pollBase: "",
      wsFails: 0, postFails: 0, hsTimer: 0,
    };
    ctxs.set(cfg.id, c);
  } else c.cfg = cfg;
  return c;
}

function disconnectCtx(ctx, text) {
  ctx.pollGen++;                 // 掐掉轮询循环
  clearInterval(ctx.pairTimer); ctx.pairTimer = 0;
  stopCloudPing(ctx);
  clearTimeout(ctx.reconnectTimer); ctx.reconnectTimer = 0;
  clearTimeout(ctx.hsTimer); ctx.hsTimer = 0;
  try { ctx.ws && ctx.ws.close(); } catch {}
  ctx.ws = null;
  ctx.status = "offline";
  ctx.statusText = text || "已断开";
}

function connectServer(cfg) {
  if (cfg.kind === "cloud") connectCloudFor(ensureCtx(cfg), false);
  else connectLan(ensureCtx(cfg));
}
function connectAll() { for (const cfg of servers) connectServer(cfg); }

const PERM_CYCLE = ["default", "acceptEdits", "plan"];
const PERM_LABEL = { default: "标准", acceptEdits: "自动编辑", plan: "规划" };

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
  });
}

function toast(msg, ms = 2600) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), ms);
}

// ---------- 连接（每源独立状态机：一处断另一处还在） ----------
function connectLan(ctx) {
  const cfg = ctx.cfg;
  if (!cfg.wsUrl || !cfg.token) { ctx.status = "offline"; ctx.statusText = "未配置"; renderServers(); renderConnChip(); return; }
  clearTimeout(ctx.reconnectTimer);
  const url = cfg.wsUrl + "?token=" + encodeURIComponent(cfg.token) +
    (ctx.sessions.size > 0 && ctx.lastSeq > 0 ? "&last_seq=" + ctx.lastSeq : "");
  setConn(ctx, "connecting", "连接中");
  try { ctx.ws && ctx.ws.close(); } catch {}
  const w = new WebSocket(url);
  ctx.ws = w;
  w.onopen = () => {
    if (ctx.ws !== w) return;
    ctx.reconnectDelay = 1000;
    setConn(ctx, "online", "已连接");
  };
  w.onclose = () => {
    if (ctx.ws !== w) return;
    setConn(ctx, "offline", "已断开");
    scheduleReconnect(ctx);
  };
  w.onerror = () => {};
  w.onmessage = (ev) => {
    if (ctx.ws !== w) return;
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === "COMMAND_ACK") { onAck(msg); return; }
    if (msg.seq !== undefined) ctx.lastSeq = Math.max(ctx.lastSeq, msg.seq);
    onEvent(ctx, msg);
  };
}

// 云桥：浏览器 → 桥(ws) → 家里 relay，帧全部 tweetnacl box 密封（桥只见密文）。
// 配对走一次性配对链接（#bt=&rd=&rk=&pc=）或 6 位配对码，成功后写回本源 cloud.rd/rk。
// WS 升级被公司 TLS 解密代理掐断时（握手返回 200 非 101）自动降级 HTTP 长轮询。
function connectCloudFor(ctx, manual) {
  const cfg = ctx.cfg;
  const base = cfg.wsUrl;
  if (!base) { ctx.status = "offline"; ctx.statusText = "未配置"; renderServers(); renderConnChip(); return; }
  loadCloudIdentity();
  const peer = cloudPeerOf(cfg);
  const pair = ctx.pendingPair || pendingPairOf(cfg.id);
  ctx.pendingPair = pair;
  if (!peer && !pair) {
    setConn(ctx, "offline", "未配对");
    if (manual) {
      toast("请输入配对码配对（家里 PC 领取）");
      openPanel("conn");
      setTimeout(() => { if (formKind === "cloud") $("pairCode").focus(); }, 80);
    }
    return;
  }
  const dev = devId(ckp.publicKey, "wb");
  ctx.pollGen++;                 // 掐掉旧轮询循环（若有）
  clearInterval(ctx.pairTimer);
  clearTimeout(ctx.reconnectTimer); ctx.reconnectTimer = 0;
  try { ctx.ws && ctx.ws.close(); } catch {}
  ctx.ws = null;
  setConn(ctx, "connecting", peer && !pair ? "连接中 ☁" : "配对中…");
  if (ctx.transport === "poll") { startPollTransport(ctx, base, serverBridgeToken(cfg), dev, pair); return; }
  // 手填 https://…/cloud 也能连：统一归一到 ws/wss scheme
  const wsBase = base.replace(/^http:\/\//i, "ws://").replace(/^https:\/\//i, "wss://");
  const url = wsBase + (wsBase.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(serverBridgeToken(cfg)) +
    "&dev=" + encodeURIComponent(dev);
  let opened = false;
  const w = new WebSocket(url);
  ctx.ws = w;
  // 握手看门狗：公司代理可能把升级请求挂起不答（onopen/onclose 都不来），8s 强制降级。
  // 挂到 ctx 上，disconnectCtx 可清理——否则删除/编辑源撞上握手期会对孤儿 ctx 复活连接
  let switched = false;
  const switchToPoll = (why) => {
    if (switched) return;
    if (ctxs.get(ctx.cfg.id) !== ctx) return; // ctx 已被删除/替换，不复活
    switched = true;
    ctx.transport = "poll";
    console.log("[cloud:" + cfg.name + "] 切换 HTTP 轮询传输:", why);
    toast("WebSocket 被网络拦截，已切换 HTTP 轮询");
    connectCloudFor(ctx, manual);
  };
  clearTimeout(ctx.hsTimer);
  ctx.hsTimer = setTimeout(() => {
    ctx.hsTimer = 0;
    if (!opened) {
      try { ctx.ws && ctx.ws.close(); } catch {}
      switchToPoll("握手 8s 无响应");
    }
  }, 8000);
  w.onopen = () => {
    if (ctx.ws !== w) return;
    opened = true;
    clearTimeout(ctx.hsTimer); ctx.hsTimer = 0;
    ctx.reconnectDelay = 1000;
    if (!peer || pair) {
      sendPairReq(ctx, pair, dev);
      startPairWatchdog(ctx);
      return;
    }
    setConn(ctx, "online", "已连接 ☁");
    // 刷新后内存无会话：必须 last_seq=0 走全量 SNAPSHOT 重建，
    // 持久化的旧 seq 只会造成"只补增量、页面永远是空列表"
    sendCloud(ctx, { t: "hello", last_seq: ctx.sessions.size > 0 ? ctx.lastSeq : 0 });
    startCloudPing(ctx);
  };
  w.onclose = (ev) => {
    if (ctx.ws !== w) return;
    clearTimeout(ctx.hsTimer); ctx.hsTimer = 0;
    console.log("[cloud:" + cfg.name + "] ws 断开 code=" + ev.code);
    if (switched) return;
    if (!opened) { switchToPoll("握手被拒 code=" + ev.code); return; }
    ctx.wsFails++; // 连上又断且一帧未收 → 疑似代理放行握手后掐连接
    if (ctx.wsFails >= 2) { switchToPoll("ws 反复闪断 x" + ctx.wsFails); return; }
    setConn(ctx, "offline", "已断开 ☁");
    scheduleReconnect(ctx);
  };
  w.onerror = () => {};
  w.onmessage = (ev) => onCloudText(ctx, ev.data);
}

// 该云源是否已有可用 relay 身份（配对成功过且未被 nack/换代清除）
function cloudPeerOf(cfg) {
  const c = cfg.cloud;
  return c && c.paired && c.rd && c.rk ? { relay_dev: c.rd, relay_pubkey: c.rk } : null;
}
// 配对中的一次性凭据（配对链接 / 输码落下的），按源隔离存 sessionStorage
function pendingPairOf(id) {
  try { return JSON.parse(sessionStorage.getItem("ccd_pair_" + id) || "null"); } catch { return null; }
}
function setPendingPair(id, pair) {
  try {
    if (pair) sessionStorage.setItem("ccd_pair_" + id, JSON.stringify(pair));
    else sessionStorage.removeItem("ccd_pair_" + id);
  } catch {}
}
// 配对态被否定（nack/换代）：清记忆身份，rd/rk 回落到烘焙值（下次输码直接可用）
function resetCloudPairing(cfg) {
  cfg.cloud = { url: cfg.wsUrl, token: serverBridgeToken(cfg), rd: BAKED_RELAY.rd, rk: BAKED_RELAY.rk, paired: false };
  saveServers();
}

// pair_req 明文帧（relay 校验 code 后回密封 pair_ack；已配对设备发错码也幂等补 ack）
function sendPairReq(ctx, pair, dev) {
  sendCloudRaw(ctx, JSON.stringify({ to: pair.rd, data: { t: "pair_req", code: pair.pc, pubkey: ckp.publicKey, name: "web-" + dev.slice(3, 11) } }));
}
// pair_ack 可能随桥连接闪断一起丢失（relay 侧已幂等补 ack）：8s 无应答重发。
// 已配对身份存在不等于配对成功——可能是换代前的旧配对残留，必须对比 dev 号变化
function startPairWatchdog(ctx) {
  clearInterval(ctx.pairTimer);
  let tries = 0;
  const peerBefore = cloudPeerOf(ctx.cfg)?.relay_dev || "";
  ctx.pairTimer = setInterval(() => {
    const peer = cloudPeerOf(ctx.cfg);
    if ((peer && peer.relay_dev !== peerBefore) || ++tries > 3) {
      clearInterval(ctx.pairTimer);
      if (!peer) {
        setConn(ctx, "offline", "配对无应答");
        toast("配对请求一直没回音：按 F12 看 Console 的 [cloud] 日志和 Network 里 cloud-poll 请求，截图发家里", 6000);
        console.log("[cloud:" + ctx.cfg.name + "] 配对看门狗耗尽：pair_req 已重发 3 次无 pair_ack");
      }
      return;
    }
    const pair = ctx.pendingPair || pendingPairOf(ctx.cfg.id);
    if (!pair) { clearInterval(ctx.pairTimer); return; }
    sendPairReq(ctx, pair, devId(ckp.publicKey, "wb"));
  }, 8000);
}

// HTTP 长轮询传输：POST /cloud-poll 上行，GET /cloud-poll&wait=20 挂着收下行
function startPollTransport(ctx, base, token, dev, pair) {
  clearTimeout(ctx.reconnectTimer); ctx.reconnectTimer = 0; // 挂起的重连定时器会二次 connect 踢掉新连接
  const httpBase = base.replace(/^ws:\/\//i, "http://").replace(/^wss:\/\//i, "https://").replace(/\/cloud\/?$/, "");
  ctx.pollSid = uuid();
  ctx.pollBase = httpBase + "/cloud-poll?token=" + encodeURIComponent(token) +
    "&dev=" + encodeURIComponent(dev) + "&sid=" + ctx.pollSid;
  ctx.reconnectDelay = 1000;
  const peer = cloudPeerOf(ctx.cfg);
  if (!peer || pair) {
    setConn(ctx, "connecting", "配对中…(轮询)");
    sendPairReq(ctx, pair, dev);
    startPairWatchdog(ctx);
  } else {
    setConn(ctx, "online", "已连接 ☁(轮询)");
    sendCloud(ctx, { t: "hello", last_seq: ctx.sessions.size > 0 ? ctx.lastSeq : 0 });
    startCloudPing(ctx);
  }
  pollLoop(ctx); // 收包循环必须一直在跑：配对 ack / hello 回包都从它进
}

async function pollLoop(ctx) {
  const gen = ctx.pollGen;
  let netFails = 0;
  while (gen === ctx.pollGen) {
    let r;
    try { r = await fetch(ctx.pollBase + "&wait=20", { signal: AbortSignal.timeout?.(30000) }); }
    catch (e) {
      if (gen !== ctx.pollGen) return;
      if (++netFails >= 3) { setConn(ctx, "connecting", "网络不通，重试中"); console.log("[cloud:" + ctx.cfg.name + "] 轮询 GET 失败 x" + netFails + ":", e && e.message); }
      await new Promise((res) => setTimeout(res, 4000));
      continue;
    }
    if (gen !== ctx.pollGen) return;
    if (!r.ok) {
      console.log("[cloud:" + ctx.cfg.name + "] 轮询 GET HTTP " + r.status);
      // 401 自愈一次：该源自定义桥 token（手抄配对链接抄错/桥已换代）丢弃后回退
      // 页面烘焙值重建连接；烘焙值也被拒才是真换代（提示更新页面）
      if (r.status === 401) {
        if (ctx.cfg.token && ctx.cfg.token !== BAKED_BRIDGE_TOKEN) {
          console.log("[cloud:" + ctx.cfg.name + "] 401：丢弃本地桥 token，回退烘焙值重试");
          ctx.cfg.token = BAKED_BRIDGE_TOKEN;
          if (ctx.cfg.cloud) ctx.cfg.cloud.token = BAKED_BRIDGE_TOKEN;
          saveServers();
          ctx.pollGen++;
          ctx.transport = "ws"; // 重走 WS 优先（之前可能因坏 token 降级过轮询）
          connectCloudFor(ctx, false);
          return;
        }
        setConn(ctx, "offline", "云桥拒绝"); toast("云桥 token 无效（页面烘焙值也被拒）：桥已换代，需更新页面");
      }
      break; // 其余 401/400：回到重连流程重建会话
    }
    let out;
    try { out = await r.json(); } catch { break; }
    if (gen !== ctx.pollGen) return;
    netFails = 0;
    if (out.frames && out.frames.length) console.log("[cloud:" + ctx.cfg.name + "] 轮询收到", out.frames.length, "帧");
    for (const f of out.frames || []) onCloudText(ctx, f);
    if (out.closed) { console.log("[cloud:" + ctx.cfg.name + "] 轮询会话被关闭（顶替/超时），重建"); break; }
  }
  if (gen === ctx.pollGen) { setConn(ctx, "offline", "已断开 ☁"); scheduleReconnect(ctx); }
}

// 下行帧统一入口（ws onmessage 与轮询 GET 共用，按源）
function onCloudText(ctx, text) {
  let f;
  try { f = JSON.parse(text); } catch { return; }
  const cfg = ctx.cfg;
  if (f.type === "ROUTE_MISS") {
    // 配对期 ROUTE_MISS：待配对 rd 不在线——本源记忆的 relay 身份失效
    //（relay 换过密钥对）时清掉，换烘焙 rd/rk 携同一配对码重试（一次性自愈）
    const pair = ctx.pendingPair || pendingPairOf(cfg.id);
    if (pair && BAKED_RELAY.rd && BAKED_RELAY.rd !== pair.rd) {
      resetCloudPairing(cfg);
      ctx.pendingPair = { rd: BAKED_RELAY.rd, rk: BAKED_RELAY.rk, pc: pair.pc };
      setPendingPair(cfg.id, ctx.pendingPair);
      console.log("[cloud:" + cfg.name + "] 配对 ROUTE_MISS，改用烘焙 relay 身份重试");
      sendPairReq(ctx, ctx.pendingPair, devId(ckp.publicKey, "wb"));
      startPairWatchdog(ctx); // 重置看门狗：换 rd 重试不与旧 rd 共享 3 次预算
      return;
    }
    setConn(ctx, "offline", "家里 relay 离线");
    return;
  }
  if (f.type === "ERROR") return;
  // 明文帧：relay 发现本设备未配对/密钥失效时回的 pair_nack（它不知道我方
  // 公钥、无法加密）——清掉失效配对态，显示"未配对"并停掉注定无效的重试
  if (f.data && !f.data.n) {
    if (f.data.t === "pair_nack") {
      disconnectCtx(ctx, "未配对");
      setPendingPair(cfg.id, null);
      ctx.pendingPair = null;
      resetCloudPairing(cfg);
      renderServers(); renderConnChip(); render();
      toast("请输入配对码重新配对（家里 PC 领取）", 6000);
      console.log("[cloud:" + cfg.name + "] relay 判定未配对:", f.data.error);
      openPanel("conn");
      setTimeout(() => { if (formKind === "cloud") $("pairCode").focus(); }, 80);
    }
    return;
  }
  if (!f.data) return;
  // 配对期优先 pendingPair.rk：已配对身份可能是换代前旧公钥，拿它解 pair_nack 会静默失败（用户看到"点了没反应"）
  const senderPk = ctx.pendingPair ? ctx.pendingPair.rk : (cloudPeerOf(cfg)?.relay_pubkey || "");
  if (!senderPk) return;
  const inner = unseal(f.data, senderPk, ckp.secretKey);
  if (!inner) return;
  ctx.wsFails = 0; // 收到有效密封帧 = 传输链路健康
  if (inner.t === "pair_ack") {
    clearInterval(ctx.pairTimer);
    cfg.cloud = { url: cfg.wsUrl, token: serverBridgeToken(cfg), rd: inner.relay_dev, rk: inner.relay_pubkey, paired: true };
    saveServers();
    setPendingPair(cfg.id, null);
    ctx.pendingPair = null;
    setConn(ctx, "online", ctx.transport === "poll" ? "已连接 ☁(轮询)" : "已连接 ☁");
    toast("配对成功");
    sendCloud(ctx, { t: "hello", last_seq: ctx.sessions.size > 0 ? ctx.lastSeq : 0 });
    startCloudPing(ctx);
    return;
  }
  if (inner.t === "pair_nack") {
    clearInterval(ctx.pairTimer);
    // 码一次性：失败即作废，清掉避免刷新后拿废码反复重试
    setPendingPair(cfg.id, null);
    ctx.pendingPair = null;
    resetCloudPairing(cfg);
    setConn(ctx, "offline", "未配对");
    toast("配对失败：" + (inner.error || "码无效") + "，请重新领码输入", 6000);
    openPanel("conn");
    setTimeout(() => { if (formKind === "cloud") $("pairCode").focus(); }, 80);
    return;
  }
  if (inner.t === "pong") { ctx.lastPong = Date.now(); return; }
  if (inner.type === "COMMAND_ACK") { onAck(inner); return; }
  if (inner.seq !== undefined) ctx.lastSeq = Math.max(ctx.lastSeq, inner.seq);
  onEvent(ctx, inner);
}

function loadCloudIdentity() {
  try { ckp = JSON.parse(localStorage.getItem("ccr_cloud_kp") || "null"); } catch { ckp = null; }
  if (!ckp || !ckp.publicKey || !ckp.secretKey) {
    ckp = genKp();
    lsSet("ccr_cloud_kp", JSON.stringify(ckp));
  }
}

// 传输无关的上行：ws 模式直接发；轮询模式 POST（应答/事件走 GET 长轮询回来）
function sendCloudRaw(ctx, str) {
  if (ctx.transport === "poll") {
    fetch(ctx.pollBase, { method: "POST", body: str, signal: AbortSignal.timeout?.(10000) })
      .then((r) => {
        if (r.ok) { ctx.postFails = 0; return; }
        ctx.postFails++;
        console.log("[cloud:" + ctx.cfg.name + "] 轮询 POST HTTP " + r.status);
        if (r.status === 401) {
          // 与 GET 路径同款自愈：丢弃自定义 token，回退烘焙值重建连接
          if (ctx.cfg.token && ctx.cfg.token !== BAKED_BRIDGE_TOKEN) {
            console.log("[cloud:" + ctx.cfg.name + "] POST 401：丢弃本地桥 token，回退烘焙值重试");
            ctx.cfg.token = BAKED_BRIDGE_TOKEN;
            if (ctx.cfg.cloud) ctx.cfg.cloud.token = BAKED_BRIDGE_TOKEN;
            saveServers();
            ctx.transport = "ws";
            ctx.pollGen++;
            connectCloudFor(ctx, false);
            return;
          }
          setConn(ctx, "offline", "云桥拒绝"); toast("云桥 token 无效（页面烘焙值也被拒）：桥已换代，需更新页面"); return;
        }
        if (ctx.postFails >= 3) setConn(ctx, "offline", "上行被拦 HTTP " + r.status);
      })
      .catch((e) => {
        ctx.postFails++;
        console.log("[cloud:" + ctx.cfg.name + "] 轮询 POST 失败 x" + ctx.postFails + ":", e && e.message);
        if (ctx.postFails >= 3) setConn(ctx, "offline", "上行请求失败");
      });
    return true;
  }
  if (!ctx.ws || ctx.ws.readyState !== 1) return false;
  ctx.ws.send(str);
  return true;
}

function sendCloud(ctx, obj) {
  const peer = cloudPeerOf(ctx.cfg);
  if (!peer) return false;
  return sendCloudRaw(ctx, JSON.stringify({ to: peer.relay_dev, data: seal(obj, peer.relay_pubkey, ckp.secretKey) }));
}

// 应用层心跳：兼作断线自愈（relay 侧 ping-resume 会按 last_seq 补发漏掉的事件）
function startCloudPing(ctx) {
  stopCloudPing(ctx);
  ctx.lastPong = Date.now();
  ctx.pingTimer = setInterval(() => {
    if (ctx.status !== "online") return;
    if (Date.now() - ctx.lastPong > 45000) {
      if (ctx.transport === "poll") { ctx.pollGen++; setConn(ctx, "offline", "已断开 ☁"); scheduleReconnect(ctx); }
      else { try { ctx.ws && ctx.ws.close(); } catch {} }
      return;
    }
    sendCloud(ctx, { t: "ping", last_seq: ctx.lastSeq });
  }, 20000);
}
function stopCloudPing(ctx) { if (ctx.pingTimer) { clearInterval(ctx.pingTimer); ctx.pingTimer = null; } }

// 回前台立即 resume：后台标签页的定时器会被浏览器节流甚至冻结，20s 心跳发不
// 出去；relay↔桥闪断后设备被置 inactive 的话，下行会一直黑洞到手动刷新。
// visibilitychange 不受节流影响，切回标签瞬间对每个在线云源补一次 ping-resume
//（带 last_seq，relay 会按需补发漏掉的事件）；顺带探测半开连接：8s 无回包即强制重连。
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  for (const ctx of ctxs.values()) {
    if (ctx.cfg.kind !== "cloud" || ctx.status !== "online") continue;
    if (!cloudPeerOf(ctx.cfg) || ctx.pendingPair) continue;
    const t0 = Date.now();
    sendCloud(ctx, { t: "ping", last_seq: ctx.sessions.size > 0 ? ctx.lastSeq : 0 });
    setTimeout(() => {
      if (ctx.status !== "online" || document.visibilityState !== "visible" || ctx.lastPong >= t0) return;
      console.log("[cloud:" + ctx.cfg.name + "] 回前台探测 8s 无回包，判定链路死，强制重连");
      if (ctx.transport === "poll") { ctx.pollGen++; setConn(ctx, "offline", "已断开 ☁"); scheduleReconnect(ctx); }
      else { try { ctx.ws && ctx.ws.close(); } catch {} }
    }, 8000);
  }
});

function scheduleReconnect(ctx) {
  const cfg = ctx.cfg;
  if (!cfg.wsUrl || (cfg.kind === "lan" && !cfg.token)) return;
  const delay = ctx.reconnectDelay;
  ctx.reconnectDelay = Math.min(ctx.reconnectDelay * 2, 10000);
  setConn(ctx, "connecting", delay / 1000 + "s 后重连");
  clearTimeout(ctx.reconnectTimer);
  ctx.reconnectTimer = setTimeout(() => connectServer(cfg), delay);
}

// 每源状态落点：刷新服务器列表 / 汇总连接徽标 / 会话区
function setConn(ctx, status, text) {
  ctx.status = status;
  ctx.statusText = text;
  // 任一源连接成功自动收起连接面板，把高度还给会话区（点右上角连接状态条可重开）
  if (status === "online") $("connPanel").classList.remove("open");
  renderServers();
  renderConnChip();
  render();
}

// 汇总徽标：N/M 源在线（多源同连的核心反馈）。
// className 整体覆写会抹掉 .open——折叠箭头状态以面板实际开合为准重建
function renderConnChip() {
  const list = [...ctxs.values()];
  const on = list.filter((c) => c.status === "online").length;
  const conn = list.filter((c) => c.status === "connecting").length;
  const open = $("connPanel").classList.contains("open");
  $("connChip").className = (on > 0 ? "on" : conn > 0 ? "wait" : "") + (open ? " open" : "");
  $("connText").textContent = list.length === 0 ? "未配置" : on + "/" + list.length + " 在线";
}

// 选中会话（按源寻址）
function selSession() {
  if (!selected) return null;
  const ctx = ctxs.get(selected.src);
  const s = ctx?.sessions.get(selected.sid);
  return s ? { ctx, s } : null;
}

// 命令上行按源路由：会话类命令走选中会话所属源；无选中（新建）走活动源
function firstOnlineCtx() {
  if (activeServerId) { const c = ctxs.get(activeServerId); if (c?.status === "online") return c; }
  for (const c of ctxs.values()) if (c.status === "online") return c;
  return null;
}
function sendCommandTo(ctx, type, payload) {
  if (!ctx || ctx.status !== "online") { toast("该源未连接，命令未发送"); openPanel("conn"); return false; }
  const cmd = { command_id: uuid(), type, payload, ts: Date.now() };
  if (ctx.cfg.kind === "cloud") {
    if (!sendCloud(ctx, cmd)) return false;
  } else {
    ctx.ws.send(JSON.stringify(cmd));
  }
  return true;
}

function onAck(ack) {
  if (!ack.ok && ack.error && !ack.error.startsWith("duplicate")) toast("命令失败: " + ack.error);
}

// ---------- 事件处理（作用于事件所属源的 ctx） ----------
function onEvent(ctx, msg) {
  const sid = msg.session_id;
  switch (msg.type) {
    case "SNAPSHOT": {
      ctx.sessions.clear(); ctx.timelines.clear();
      for (const s of msg.payload.sessions) {
        ctx.sessions.set(s.session_id, s);
        ctx.timelines.set(s.session_id, msg.payload.logs[s.session_id] || []);
      }
      ctx.lastSeq = Math.max(ctx.lastSeq, msg.seq);
      if (selected && selected.src === ctx.cfg.id && !ctx.sessions.has(selected.sid)) closeDetail();
      break;
    }
    case "SESSION_CREATED": {
      ctx.sessions.set(sid, {
        session_id: sid, cwd: msg.payload.cwd, initial_prompt: msg.payload.initial_prompt,
        title: msg.payload.title || msg.payload.initial_prompt.slice(0, 24),
        model: msg.payload.model, status: "WORKING", action_summary: "启动中",
        external: msg.payload.external || false, remote_mode: false,
        started_at: msg.ts, updated_at: msg.ts, stats: { files_changed: 0, lines_added: 0, lines_deleted: 0 },
      });
      ctx.timelines.set(sid, []);
      pushLog(ctx, sid, { ts: msg.ts, kind: "system", text: msg.payload.external ? "外部会话接入 (hooks)" : "会话创建" });
      // 多源：仅当选中源就是本源（或无选中）才自动跳新会话，别抢用户正在看的源
      if (!msg.payload.external && (!selected || selected.src === ctx.cfg.id)) select(sid, ctx.cfg.id);
      break;
    }
    case "SESSION_UPDATED": {
      const s = ctx.sessions.get(sid); if (!s) break;
      s.status = msg.payload.status;
      s.action_summary = msg.payload.action_summary;
      if (msg.payload.stats) s.stats = msg.payload.stats;
      // 其余可选字段：出现即覆盖（与手机端 store 对齐）
      for (const f of ["remote_mode", "title", "title_locked", "model", "turn_started_at",
        "usage", "todos", "subagents", "permission_mode", "pending_inputs", "relay_session_id", "cron_tasks"]) {
        if (msg.payload[f] !== undefined) s[f] = msg.payload[f];
      }
      s.updated_at = msg.ts;
      break;
    }
    case "SESSION_HEARTBEAT": {
      const s = ctx.sessions.get(sid); if (!s) break;
      s.elapsed_hint = msg.payload.elapsed_ms;
      s.action_summary = msg.payload.action_summary;
      break;
    }
    case "SESSION_WAITING": {
      const s = ctx.sessions.get(sid); if (!s) break;
      s.status = "WAITING";
      s.waiting_request = { ...msg.payload, received_at: msg.ts };
      break;
    }
    case "SESSION_WAITING_RESOLVED": {
      const s = ctx.sessions.get(sid); if (!s) break;
      s.status = "WORKING";
      s.waiting_request = null;
      const d = msg.payload.decision;
      const dText = d === "allow" ? "已允许" : d === "deny" ? "已拒绝" : d === "answer" ? "已作答" : "远程审批超时，回退本地";
      pushLog(ctx, sid, { ts: msg.ts, kind: "system", text: dText + (d === "timeout" ? "" : " (by " + msg.payload.by + ")") });
      break;
    }
    case "SESSION_ERROR": {
      const s = ctx.sessions.get(sid); if (!s) break;
      s.status = "ERROR"; s.last_error = msg.payload.message;
      pushLog(ctx, sid, { ts: msg.ts, kind: "system", text: "错误: " + msg.payload.message });
      break;
    }
    case "SESSION_DONE": {
      const s = ctx.sessions.get(sid); if (!s) break;
      s.status = "DONE"; s.done_reason = msg.payload.terminal_reason;
      s.duration_ms = msg.payload.duration_ms;
      if (msg.payload.stats) s.stats = msg.payload.stats;
      pushLog(ctx, sid, { ts: msg.ts, kind: "system", text: "完成: " + msg.payload.terminal_reason + " · " + (msg.payload.duration_ms / 1000).toFixed(1) + "s" });
      break;
    }
    case "SESSION_DELETED": {
      ctx.sessions.delete(sid);
      break;
    }
    case "SESSION_LOG": {
      if (msg.payload?.kind === "user_message") consumePendingByUserMsg(ctx, sid, msg.payload.text ?? "");
      pushLog(ctx, sid, msg.payload);
      break;
    }
  }
  render();
}

// 兜底：user_message 晋升日志到达时本地移除被覆盖的排队条目
// （正常路径靠 SESSION_UPDATED.pending_inputs 清空；该帧丢失/旧版 relay 不发时由此兜底，
// 排队气泡才不会在消息已处理后一直闪烁）
function consumePendingByUserMsg(ctx, sid, text) {
  const s = ctx.sessions.get(sid);
  if (!s?.external || !s.pending_inputs?.length) return;
  const key = String(text).trim().replace(/\s+/g, " ");
  if (!key) return;
  const kept = s.pending_inputs.filter((p) => {
    const pk = String(p.text ?? "").trim().replace(/\s+/g, " ").slice(0, 200);
    return !(pk && key.includes(pk));
  });
  if (kept.length !== s.pending_inputs.length) s.pending_inputs = kept.length ? kept : undefined;
}

// 同 id 流式块原地替换（relay stream_event：SESSION_LOG 带 id = 增量更新同一条）
function pushLog(ctx, sid, entry) {
  if (!ctx.timelines.has(sid)) ctx.timelines.set(sid, []);
  const list = ctx.timelines.get(sid);
  const e = {
    ts: entry.ts || Date.now(), kind: entry.kind, text: entry.text, tool: entry.tool,
    id: entry.id, full: entry.full, streaming: entry.streaming, detail: entry.detail, diff: entry.diff,
  };
  if (e.id) {
    const i = list.findIndex((x) => x.id === e.id);
    if (i >= 0) { list[i] = e; return; }
  }
  list.push(e);
  if (list.length > 400) list.splice(0, list.length - 400);
}

// ---------- 渲染 ----------
function chip(status) {
  return '<span class="status-chip s-' + status + '"><i></i>' + status + "</span>";
}

function fmtElapsed(ms) {
  const sec = Math.floor(ms / 1000);
  if (sec < 60) return sec + "s";
  const min = Math.floor(sec / 60);
  if (min < 60) return min + "m" + (sec % 60) + "s";
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + "h" + (min % 60) + "m";
  return Math.floor(hr / 24) + "d" + (hr % 24) + "h";
}

function sessionElapsed(s) {
  if (s.status === "DONE" && s.duration_ms) return s.duration_ms;
  if (s.historical || s.status === "ERROR") return s.updated_at - s.started_at;
  return Date.now() - s.started_at;
}

function statsHtml(st) {
  if (!st || st.files_changed === 0) return "";
  return st.files_changed + " 文件 · <span class='add'>+" + st.lines_added + "</span> <span class='del'>-" + st.lines_deleted + "</span>";
}

// 上下文水位：context_usage/context_limit 均由 relay 按模型下发（手机端同口径）；
// 判级用原始比值（与手机端 contextLevel 一致，避免取整边界色级不一致）
function ctxPct(s) {
  if (!s || !s.context_usage) return 0;
  const limit = s.context_limit || 200000;
  return Math.min(100, Math.round((s.context_usage / limit) * 100));
}
function ctxHtml(s, mini) {
  const used = (s && s.context_usage) || 0;
  if (!used) return "";
  const limit = (s && s.context_limit) || 200000;
  const pct = ctxPct(s);
  const r = used / limit;
  const lv = r < 0.6 ? "done" : r < 0.85 ? "working" : "waiting";
  const col = "var(--" + lv + ")";
  return mini
    ? '<span class="ctx-mini"><span class="ctx-mini-bar"><i style="width:' + pct + "%;background:" + col + '"></i></span><span class="ctx-mini-t" style="color:' + col + '">' + pct + "%</span></span>"
    : '<span class="lbl">上下文</span><span class="bar"><i style="width:' + pct + "%;background:" + col + '"></i></span><span class="t" style="color:' + col + '">' + pct + "%</span>";
}

// 全源会话视图（含所属源，供角标/过滤/命令路由）
function allSessions() {
  const out = [];
  for (const ctx of ctxs.values()) for (const s of ctx.sessions.values()) out.push({ ctx, s });
  return out;
}
const SRC_COLORS = ["#D97757", "#5B9DFF", "#2BD98F", "#FFC53D", "#C792EA", "#F06292", "#4DD0E1", "#7E57C2"];
function srcColor(id) {
  let h = 0;
  for (const ch of String(id)) h = ((h * 31) + ch.charCodeAt(0)) >>> 0;
  return SRC_COLORS[h % SRC_COLORS.length];
}
function srcBadgeHtml(cfg) {
  return '<span class="src-badge" title="' + escapeHtml(cfg.name) + '"><i style="background:' + srcColor(cfg.id) + '"></i>' + escapeHtml((cfg.name || "?").slice(0, 2)) + "</span>";
}

// 列表上方源过滤 chips（单源时隐藏）；过滤目标被删/失效时自愈回"全部"
function renderSrcChips() {
  if (filterSrc !== "all" && !servers.some((s) => s.id === filterSrc)) filterSrc = "all";
  const box = $("srcChips");
  if (servers.length <= 1) { box.style.display = "none"; box.dataset.key = ""; box.innerHTML = ""; return; }
  const parts = servers.map((s) => s.id + ":" + s.name + ":" + (ctxs.get(s.id)?.sessions.size || 0));
  const key = filterSrc + "|" + parts.join("|");
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.style.display = "flex";
  box.innerHTML = '<button data-f="all" class="' + (filterSrc === "all" ? "on" : "") + '">全部 ' + allSessions().length + "</button>" +
    servers.map((s) => {
      const n = ctxs.get(s.id)?.sessions.size || 0;
      return '<button data-f="' + s.id + '" class="' + (filterSrc === s.id ? "on" : "") + '" title="' + escapeHtml(s.name) + '">' +
        '<i style="background:' + srcColor(s.id) + '"></i><span>' + escapeHtml(s.name) + " " + n + "</span></button>";
    }).join("");
  box.querySelectorAll("button").forEach((b) => {
    b.onclick = () => { filterSrc = b.dataset.f; renderSrcChips(); render(); };
  });
}

function render() {
  // 运行计数（全源汇总）
  let running = 0, total = 0, anyOnline = false;
  for (const ctx of ctxs.values()) {
    anyOnline = anyOnline || ctx.status === "online";
    for (const s of ctx.sessions.values()) {
      total++;
      if (s.status === "WORKING" || s.status === "WAITING") running++;
    }
  }
  $("runhint").textContent = running > 0 ? running + " 个会话正在运行" :
    (total > 0 ? "暂无运行中的会话" : (anyOnline ? "已连接 · 暂无会话" : "等待连接"));
  renderSrcChips();

  const box = $("cards");
  // 排序：运行中 > 等待 > 其余，同组按开始时间倒序
  const order = { WAITING: 0, WORKING: 1, ERROR: 2, DONE: 3 };
  let entries = allSessions();
  if (filterSrc !== "all") entries = entries.filter((e) => e.ctx.cfg.id === filterSrc);
  const list = entries.sort((a, b) =>
    (order[a.s.status] - order[b.s.status]) || (b.s.started_at - a.s.started_at));
  const key = list.map((e) => e.ctx.cfg.id + ":" + e.s.session_id + ":" + e.s.status + ":" + Math.floor(sessionElapsed(e.s) / 1000) + ":" + (e.s.title || "") + ":" + (e.s.action_summary || "") + ":" + (e.s.waiting_request ? 1 : 0) + ":" + ctxPct(e.s)).join("|");
  if (box.dataset.key !== key) {
    // 就地改名进行中：跳过重建（运行中会话 key 每秒变，会把编辑框冲掉）
    if (document.activeElement && document.activeElement.classList.contains("card-rename")) return;
    box.dataset.key = key;
    box.innerHTML = "";
    for (const { ctx, s } of list) {
      const d = document.createElement("div");
      d.dataset.sid = s.session_id;
      d.dataset.src = ctx.cfg.id;
      d.className = "card " + s.status + (selected && selected.src === ctx.cfg.id && s.session_id === selected.sid ? " sel" : "") + (s.historical ? " historical" : "");
      const waiting = !!s.waiting_request;
      const waitingText = waiting
        ? (s.waiting_request.questions?.length ? "Claude 在提问：" + (s.waiting_request.questions[0].header || "") : "需要确认 " + s.waiting_request.tool_name + " — " + (s.waiting_request.input_summary || ""))
        : (s.action_summary || "");
      d.innerHTML =
        '<div class="card-top">' + chip(s.status) + '<span style="display:flex;align-items:center;gap:6px">' +
          srcBadgeHtml(ctx.cfg) + '<span class="elapsed">' + fmtElapsed(sessionElapsed(s)) + "</span></span></div>" +
        '<div class="card-title">' + escapeHtml(s.title || "") +
          (s.historical ? '<span class="his-badge">历史</span>' : s.external ? '<span class="his-badge ext">外部</span>' : "") +
          '<button class="card-edit" title="重命名">✎</button></div>' +
        '<div class="card-summary' + (waiting ? " waiting" : "") + '">' + escapeHtml(waitingText) + "</div>" +
        '<div class="card-stats">' + statsHtml(s.stats) + ctxHtml(s, true) + "</div>" +
        (waiting && !s.historical && s.waiting_request?.decidable !== false ? '<div class="card-cta"><button>处理</button></div>' : "");
      d.onclick = () => select(s.session_id, ctx.cfg.id);
      const cta = d.querySelector(".card-cta button");
      if (cta) cta.onclick = (e) => { e.stopPropagation(); select(s.session_id, ctx.cfg.id); };
      const edit = d.querySelector(".card-edit");
      if (edit) edit.onclick = (e) => { e.stopPropagation(); startCardRename(d, s, ctx); };
      box.appendChild(d);
    }
  } else {
    // 仅刷新选中态
    for (const el of box.children) el.classList.toggle("sel", !!selected && el.dataset.src === selected.src && el.dataset.sid === selected.sid);
  }
  renderDetail();
}

function renderDetail() {
  const sel = selSession();
  const s = sel?.s;
  const has = !!s;
  $("detail").style.display = has ? "flex" : "none";
  $("empty").style.display = has ? "none" : "flex";
  if (!has) return;

  $("dtitle").textContent = s.title || "";
  $("dbadge").outerHTML = '<span id="dbadge" class="status-chip"></span>';
  $("dbadge").innerHTML = chip(s.status);
  $("dsrc").innerHTML = srcBadgeHtml(sel.ctx.cfg);
  $("dcwd").textContent = s.cwd;
  $("dmodel").textContent = s.model || "";
  $("delapsed").textContent = "⏱ " + fmtElapsed(sessionElapsed(s));
  $("dctx").innerHTML = ctxHtml(s, false);

  // 思考开关 / 权限模式 chip
  $("thinkBtn").classList.toggle("on", thinkShown);
  const permBtn = $("permBtn");
  if (!s.external && !s.historical) {
    permBtn.style.display = "";
    const pm = s.permission_mode ?? "default";
    permBtn.textContent = "权限·" + (PERM_LABEL[pm] ?? pm);
    permBtn.classList.toggle("on", pm !== "default");
  } else permBtn.style.display = "none";

  // WAITING 处理框
  const wb = $("waitbox");
  if (s.status === "WAITING" && s.waiting_request && !s.historical) {
    wb.style.display = "block";
    const passive = s.waiting_request.decidable === false;
    const isAsk = Array.isArray(s.waiting_request.questions) && s.waiting_request.questions.length > 0;
    $("waitdetail").textContent = (s.waiting_request.tool_name ? s.waiting_request.tool_name + " — " : "") + (s.waiting_request.input_summary || "");
    const wsec = Math.floor((Date.now() - (s.waiting_request.received_at || Date.now())) / 1000);
    $("waitelapsed").textContent = passive ? "CLI 正在本地等待确认，请在电脑上处理" : "已等待 " + wsec + "s" +
      (s.waiting_request.suggestions?.length && !isAsk ? " · 建议: " + s.waiting_request.suggestions.join(" / ") : "");
    const cmds = document.querySelector("#waitbox .cmds");
    if (cmds) cmds.style.display = passive ? "none" : "flex";
    $("askCancel").style.display = passive ? "none" : "";
    $("allowBtn").style.display = isAsk ? "none" : "";
    $("rejectBtn").style.display = isAsk ? "none" : "";
    $("answerBtn").style.display = isAsk ? "" : "none";
    renderQuestions(s.waiting_request);
  } else {
    wb.style.display = "none";
  }

  // WORKING 状态行（类 CLI：✶ 摘要 · 回合耗时）
  const lr = $("liverow");
  if (s.status === "WORKING") {
    lr.style.display = "flex";
    $("livesum").textContent = s.action_summary || "思考中…";
    $("liveel").textContent = "· " + fmtElapsed(Date.now() - (s.turn_started_at ?? s.updated_at));
  } else lr.style.display = "none";

  // 子 Agent 状态（external 会话）
  const ag = $("agbox");
  const subs = s.subagents ?? [];
  if (subs.length > 0) {
    ag.style.display = "block";
    ag.innerHTML = subs.slice(-4).map((a) => {
      const run = !a.ended_at;
      const dur = fmtElapsed((a.ended_at ?? Date.now()) - a.started_at);
      return '<div class="agrow"><span class="ad" style="color:' + (run ? "var(--working)" : "var(--dim)") + '">' +
        (run ? "⑂ " : "✓ ") + escapeHtml(a.desc) + '</span><span class="at">' + dur + "</span></div>";
    }).join("");
  } else ag.style.display = "none";

  // 排队注入消息（external 会话 CLI 忙时）
  const pb = $("pendbox");
  const pi = s.pending_inputs ?? [];
  if (pi.length > 0) {
    pb.style.display = "flex";
    pb.innerHTML = pi.map((p) => "<span>" + escapeHtml(p.text) + "</span>").join("");
  } else pb.style.display = "none";

  // 外部会话
  $("hisnote").style.display = s.historical ? "block" : "none";
  $("cmdbar").style.display = s.historical && !s.external ? "none" : "flex";
  $("msginput").placeholder = s.external
    ? "注入到终端（空闲即发，忙碌排队）"
    : "发送消息（Enter 发送 · Shift+Enter 换行）";
  // 停止入口只在运行中出现（WorkBuddy 式：执行中输入区显示停止）
  const running = s.status === "WORKING" || s.status === "WAITING";
  $("stopBtn").style.display = running ? "flex" : "none";
  $("stopBtn").textContent = s.external ? "⏹ 注入 Esc" : "⏹ 停止";
  $("stopBtn").title = s.external ? "注入 Esc 打断" : "停止会话";

  // 时间线 / 统计（增量重建）
  const tl = $("timeline");
  if (activeTab === "stats") {
    const statsKey = "stats:" + s.session_id + ":" + s.status + ":" + Math.floor(sessionElapsed(s) / 1000);
    if (tl.dataset.count !== statsKey) {
      tl.dataset.count = statsKey;
      tl.innerHTML = statsTabHtml(s);
    }
    return;
  }
  if (activeTab === "todos") {
    const todosKey = "todos:" + s.session_id + ":" + (s.todos?.length ?? 0) + ":" + (s.todos?.map((t) => t.status).join(",") ?? "");
    if (tl.dataset.count !== todosKey) {
      tl.dataset.count = todosKey;
      tl.innerHTML = todosTabHtml(s);
      const ref = $("todoRefresh");
      if (ref) ref.onclick = () => sendCommandTo(sel.ctx, "COMMAND_REFRESH_TODOS", { session_id: s.session_id });
    }
    return;
  }
  if (activeTab === "cron") {
    // 全量序列化作 key：改名/暂停/下次时间任一变化都触发重建
    const cronKey = "cron:" + s.session_id + ":" + JSON.stringify(s.cron_tasks ?? null);
    if (tl.dataset.count !== cronKey) {
      tl.dataset.count = cronKey;
      tl.innerHTML = cronTabHtml(s);
    }
    return;
  }
  const full = sel.ctx.timelines.get(s.session_id) || [];
  const list = activeTab === "activity"
    ? full.filter((e) => e.kind === "assistant_text" || e.kind === "user_message" || e.kind === "system" || (e.kind === "thinking" && thinkShown))
    : full;
  const last = list[list.length - 1];
  // 流式更新（同条 text 变长）与展开切换都要触发重建
  const renderKey = [s.session_id, activeTab, list.length, last?.text?.length ?? 0, last?.full?.length ?? 0, expandRev, thinkShown].join(":");
  if (tl.dataset.count !== renderKey) {
    const nearBottom = tl.scrollHeight - tl.scrollTop - tl.clientHeight < 80;
    tl.dataset.count = renderKey;
    tl.innerHTML = list.length === 0
      ? '<div style="color:var(--faint);padding:40px 4px;text-align:center">（暂无内容）</div>'
      : renderTimeline(list);
    if (nearBottom || list.length <= 5) tl.scrollTop = tl.scrollHeight;
  }
}

function statsTabHtml(s) {
  const u = s.usage;
  const rows = [
    ["状态", s.status],
    ["目录", s.cwd],
    ["模型", s.model || "-"],
    ["权限模式", s.external ? "-" : (PERM_LABEL[s.permission_mode ?? "default"] ?? s.permission_mode ?? "标准")],
    ["开始时间", new Date(s.started_at).toLocaleString("zh-CN", { hour12: false })],
    ["用时", fmtElapsed(sessionElapsed(s))],
    ["修改文件", String(s.stats?.files_changed ?? 0)],
    ["增删行", "+" + (s.stats?.lines_added ?? 0) + " / -" + (s.stats?.lines_deleted ?? 0)],
    ["任务清单", (s.todos?.length ?? 0) + " 项"],
    ...(u ? [
      ["输入 token", u.input_tokens.toLocaleString()],
      ["输出 token", u.output_tokens.toLocaleString()],
      ["缓存读", (u.cache_read_input_tokens ?? 0).toLocaleString()],
      ["缓存写", (u.cache_creation_input_tokens ?? 0).toLocaleString()],
    ] : []),
    [s.status === "ERROR" ? "错误" : "结束原因", s.status === "ERROR" ? (s.last_error || "-") : (s.done_reason || "-")],
    ["Session ID", s.session_id],
  ];
  return '<div class="stats-card">' + rows.map((r) =>
    '<div class="stats-row"><span class="k">' + r[0] + '</span><span class="v">' + escapeHtml(String(r[1])) + "</span></div>").join("") + "</div>";
}

function todosTabHtml(s) {
  const todos = s.todos ?? [];
  if (!todos.length) return '<div class="todo-empty">暂无任务清单<br><span style="font-size:12px">CLI 里使用 TodoWrite 工具后，这里会显示任务进度</span></div>';
  const done = todos.filter((t) => t.status === "completed").length;
  // 分组顺序对齐手机端：已完成置顶，进行中/待办在下方
  const groups = [
    ["已完成", todos.filter((t) => t.status === "completed"), "dn"],
    ["进行中", todos.filter((t) => t.status === "in_progress"), "ip"],
    ["待办", todos.filter((t) => t.status === "pending"), ""],
  ];
  let html =
    '<div class="todo-head"><div class="todo-bar"><i style="width:' + Math.round((done / todos.length) * 100) + '%"></i></div>' +
    '<span class="todo-pct">' + done + " / " + todos.length + '</span>' +
    '<button id="todoRefresh" class="ghost" title="重读 CLI 任务存储">↻ 刷新</button></div>';
  for (const [label, items, cls] of groups) {
    if (!items.length) continue;
    html += '<div class="todo-group"><div class="todo-gt ' + cls + '">' + label + " · " + items.length + "</div>";
    for (const t of items) {
      const mark = t.status === "completed" ? "✓" : t.status === "in_progress" ? "◐" : "·";
      html += '<div class="todo-item ' + t.status + '"><span class="todo-ck">' + mark + '</span><span class="todo-tx">' + escapeHtml(t.content) + "</span></div>";
    }
    html += "</div>";
  }
  return html;
}

// 定时任务 tab（详情页"定时"，与手机端 cron 面板同构）
function cronTabHtml(s) {
  const tasks = s.cron_tasks ?? [];
  if (!tasks.length) return '<div class="todo-empty">暂无定时任务<br><span style="font-size:12px">CLI 里创建 durable 定时任务后，这里 30s 内显示</span></div>';
  return tasks.map((t) =>
    '<div class="cron-item' + (t.paused ? " paused" : "") + '">' +
      '<span class="cron-mark">' + (t.paused ? "⏸" : "⏰") + "</span>" +
      '<div class="cron-main"><div class="cron-name">' + escapeHtml(t.name) + "</div>" +
      '<div class="cron-meta">' + escapeHtml(t.schedule) +
        (t.recurring === false ? " · 一次性" : "") +
        (t.next_run_at ? " · 下次 " + fmtDT(t.next_run_at) : "") +
      "</div></div></div>").join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- 轻量 Markdown（移植自 expo-app/src/md.tsx：GFM 表格/码块/列表/引用等） ----------
const MD_DELIM_RE = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
const mdSplitRow = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
function mdBlocks(src) {
  const out = [];
  const lines = String(src).split(/\r?\n/);
  let para = [], inCode = false, code = [], tableBuf = [];
  const flush = () => { if (para.length) { out.push({ t: "p", text: para.join("\n") }); para = []; } };
  const flushTable = () => {
    if (!tableBuf.length) return;
    if (tableBuf.length >= 2 && MD_DELIM_RE.test(tableBuf[1])) {
      out.push({ t: "table", head: mdSplitRow(tableBuf[0]), rows: tableBuf.slice(2).map(mdSplitRow) });
    } else out.push({ t: "p", text: tableBuf.join("\n") });
    tableBuf = [];
  };
  for (const raw of lines) {
    if (inCode) {
      if (/^\s*```/.test(raw)) { out.push({ t: "code", text: code.join("\n") }); code = []; inCode = false; }
      else code.push(raw);
      continue;
    }
    if (/^\s*```/.test(raw)) { flush(); inCode = true; continue; }
    if (/^\s*\|/.test(raw)) { flush(); tableBuf.push(raw); continue; }
    flushTable();
    const h = /^(#{1,4})\s+(.*)$/.exec(raw);
    if (h) { flush(); out.push({ t: "h", level: h[1].length, text: h[2] }); continue; }
    if (/^\s*([-*_]\s*){3,}$/.test(raw)) { flush(); out.push({ t: "hr" }); continue; }
    const li = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(raw);
    if (li) { flush(); out.push({ t: "li", depth: Math.min(2, Math.floor(li[1].length / 2)), ord: /\d/.test(li[2]) ? li[2].replace(/[.)]/, "") : null, text: li[3] }); continue; }
    const q = /^>\s?(.*)$/.exec(raw);
    if (q) { flush(); out.push({ t: "quote", text: q[1] }); continue; }
    if (!raw.trim()) flush();
    else para.push(raw);
  }
  if (inCode && code.length) out.push({ t: "code", text: code.join("\n") }); // 截断码块兜底
  flushTable();
  flush();
  return out;
}
const MD_INLINE_RE = /(\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_[^_\n]+_|`[^`\n]+`|\[[^\]\n]+\]\([^)\n]+\))/g;
function mdInline(text) {
  let out = "", last = 0;
  for (const m of String(text).matchAll(MD_INLINE_RE)) {
    const tok = m[0], i = m.index ?? 0;
    out += escapeHtml(text.slice(last, i));
    if (tok.startsWith("**") || tok.startsWith("__")) out += "<b>" + escapeHtml(tok.slice(2, -2)) + "</b>";
    else if (tok.startsWith("`")) out += "<code>" + escapeHtml(tok.slice(1, -1)) + "</code>";
    else if (tok.startsWith("[")) out += "<b>" + escapeHtml(/^\[([^\]]+)\]/.exec(tok)?.[1] ?? tok) + "</b>";
    else out += "<i>" + escapeHtml(tok.slice(1, -1)) + "</i>";
    last = i + tok.length;
  }
  return out + escapeHtml(text.slice(last));
}
function mdHtml(src) {
  let html = "";
  for (const b of mdBlocks(src)) {
    if (b.t === "h") html += '<div class="md-h' + b.level + '">' + mdInline(b.text) + "</div>";
    else if (b.t === "code") html += '<pre class="md-code">' + escapeHtml(b.text) + "</pre>";
    else if (b.t === "li") html += '<div class="md-li" style="padding-left:' + (14 + b.depth * 14) + 'px"><span class="md-bul">' + (b.ord ? b.ord + "." : "•") + "</span> " + mdInline(b.text) + "</div>";
    else if (b.t === "quote") html += '<div class="md-quote">' + mdInline(b.text) + "</div>";
    else if (b.t === "table") html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>' +
      b.head.map((c) => "<th>" + mdInline(c) + "</th>").join("") + "</tr></thead><tbody>" +
      b.rows.map((r) => "<tr>" + b.head.map((_, j) => "<td>" + mdInline(r[j] ?? "") + "</td>").join("") + "</tr>").join("") +
      "</tbody></table></div>";
    else if (b.t === "hr") html += '<div class="md-hr"></div>';
    else html += '<div class="md-p">' + mdInline(b.text) + "</div>";
  }
  return html;
}

// ---------- 时间线条目（聊天式，与手机端 TranscriptRow 对齐） ----------
const fmtHM = (ts) => new Date(ts).toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit" });
const dayKey = (ts) => {
  const d = new Date(ts);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
// 定时任务下次运行时间：MM-dd HH:mm（毫秒时间戳，与手机端 fmtDT 同构）
const fmtDT = (ts) => {
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
};
// 展开键带源前缀：时间线只显示选中会话，跨源的同 id/同 ts+长度条目不串展开态
const eKey = (e) => (selected?.src || "") + ":" + (e.id ?? (e.ts + "|" + e.kind + "|" + (e.text || "").length));
const diffLine = (l) =>
  '<div class="' + (l.startsWith("@@") ? "h" : l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : "c") + '">' + escapeHtml(l || " ") + "</div>";

function entryHtml(e, prevDay) {
  const k = escapeHtml(eKey(e)); // data-x 属性安全
  const open = expanded.has(eKey(e));
  const hm = e.ts ? fmtHM(e.ts) : "";
  let html = "";
  const day = e.ts ? dayKey(e.ts) : "";
  if (day && day !== prevDay) html += '<div class="day-sep">── ' + day + " ──</div>";
  if (e.kind === "user_message") {
    html += '<div class="msg-user"><div class="ub">' + escapeHtml(e.full ?? e.text) + "</div>" +
      (hm ? '<div class="mt">' + hm + "</div>" : "") + "</div>";
  } else if (e.kind === "assistant_text") {
    html += '<div class="msg-ai"><div class="ai-head"><span class="ai-ava">✻</span><span class="ai-name">Claude</span>' +
      (hm ? '<span class="mt">' + hm + "</span>" : "") + "</div>" +
      '<div class="ai-body"><div class="txt md">' + mdHtml(open ? (e.full ?? e.text) : e.text) +
      (e.streaming ? '<span class="stream-cur">▌</span>' : "") + "</div>" +
      (e.full ? '<span class="x-full" data-x="' + k + '">' + (open ? "收起 ▴" : "展开全文 " + e.full.length + " 字 ▾") + "</span>" : "") +
      "</div></div>";
  } else if (e.kind === "thinking") {
    const src = e.full ?? e.text;
    html += '<div class="think"><div class="th-head" data-x="' + k + '">' +
      (open ? "▾ 思考过程" : "▸ 思考过程 · " + src.length + " 字") + (hm ? " · " + hm : "") + "</div>" +
      (open ? '<div class="th-body txt md">' + mdHtml(src) + "</div>" : "") + "</div>";
  } else if (e.kind === "tool_use") {
    const t = e.tool || "";
    const tico = /^(Edit|Write|MultiEdit|NotebookEdit)$/.test(t) ? "✎" : t === "Bash" ? "❯_" : /^(Read|Glob|Grep|WebFetch|WebSearch)$/.test(t) ? "▤" : "⚙";
    html += '<div class="trow"><div class="tline"><span class="tico">' + tico + '</span><span class="tname">' + escapeHtml(t || "tool") + "</span><span>" + escapeHtml(e.text) + "</span>" +
      (e.detail
        ? (open
          ? '<span class="x-full" data-x="' + k + '">收起 ▴</span>'
          : '<span class="x-full" data-x="' + k + '">展开 ▾</span>')
        : "") + "</div>" +
      (open && e.detail ? '<div class="tdetail">' + escapeHtml(e.detail) + "</div>" : "") + "</div>";
  } else if (e.kind === "tool_result") {
    if (e.diff && e.diff.length) {
      const plus = e.diff.filter((l) => l.startsWith("+")).length;
      const minus = e.diff.filter((l) => l.startsWith("-")).length;
      html += '<div class="trow"><div class="tline"><span class="tico">✎</span><span class="tres x-full" data-x="' + k + '">' +
        (open ? "收起变更 ▴" : "变更 <span class='ds-add'>+" + plus + "</span> <span class='ds-del'>-" + minus + "</span> ▾") +
        "</span></div>" +
        (open ? '<div class="diff">' + e.diff.map(diffLine).join("") + "</div>" : "") + "</div>";
    } else if (e.detail) {
      html += '<div class="trow"><div class="tline"><span class="tico">↳</span><span class="tres">' + escapeHtml(e.text) + "</span> " + (open
        ? '<span class="x-full" data-x="' + k + '">收起 ▴</span>'
        : '<span class="x-full" data-x="' + k + '">展开 ▾</span>') + "</div>" +
        (open ? '<div class="tdetail">' + escapeHtml(e.detail) + "</div>" : "") + "</div>";
    } else {
      html += '<div class="trow"><div class="tline"><span class="tico">↳</span><span class="tres">' + escapeHtml(e.text) + "</span></div></div>";
    }
  } else {
    html += '<div class="msg-sys">' + escapeHtml(e.text) + "</div>";
  }
  return html;
}

// ---------- AskUserQuestion 选项作答（与手机端 AskBanner 对齐） ----------
let askState = null; // {rid, sel: [Set<label>...], free: [string...]}
function renderQuestions(wr) {
  const box = $("questions");
  const qs = Array.isArray(wr.questions) ? wr.questions : [];
  if (!qs.length) { box.innerHTML = ""; box.style.display = "none"; askState = null; return; }
  box.style.display = "flex";
  if (!askState || askState.rid !== wr.request_id) {
    askState = { rid: wr.request_id, sel: qs.map(() => new Set()), free: qs.map(() => "") };
    // 单问题单选：点选项即发（手机端交互）；多问题/多选：勾选后提交
    const single = qs.length === 1 && !qs[0].multi;
    box.innerHTML = qs.map((q, qi) => {
      const opts = (q.options || []).map((o, oi) =>
        '<button type="button" data-q="' + qi + '" data-o="' + oi + '"><span class="l">' + escapeHtml(o.label) + "</span>" +
        (o.description ? '<span class="d">' + escapeHtml(o.description) + "</span>" : "") + "</button>").join("");
      return '<div class="q-item" data-qi="' + qi + '">' +
        '<div class="q-header">' + escapeHtml(q.header || "问题 " + (qi + 1)) + (q.multi ? " · 可多选" : single ? " · 点选即答" : "") + '</div>' +
        '<div class="q-text">' + escapeHtml(q.question) + '</div>' +
        '<div class="q-opts">' + opts + "</div>" +
        '<input class="q-free" data-q="' + qi + '" placeholder="或自由输入…">' +
        "</div>";
    }).join("");
    box.querySelectorAll(".q-opts button").forEach((b) => {
      b.onclick = () => {
        const qi = +b.dataset.q, label = qs[qi].options[+b.dataset.o].label;
        if (single) { sendAnswer([label]); return; }
        const set = askState.sel[qi];
        if (qs[qi].multi) { set.has(label) ? set.delete(label) : set.add(label); }
        else { set.clear(); set.add(label); askState.free[qi] = ""; box.querySelector('.q-free[data-q="' + qi + '"]').value = ""; }
        syncSelClasses(qs);
      };
    });
    box.querySelectorAll(".q-free").forEach((inp) => {
      inp.oninput = () => { askState.free[+inp.dataset.q] = inp.value; };
    });
  }
}
function syncSelClasses(qs) {
  const box = $("questions");
  qs.forEach((q, qi) => {
    box.querySelectorAll('.q-opts button[data-q="' + qi + '"]').forEach((b) => {
      b.classList.toggle("sel", askState.sel[qi].has(q.options[+b.dataset.o].label));
    });
  });
}
function sendAnswer(answers) {
  const sel = selSession();
  if (!sel || !sel.s.waiting_request) return;
  if (sendCommandTo(sel.ctx, "COMMAND_ANSWER", { session_id: selected.sid, request_id: sel.s.waiting_request.request_id, answers })) {
    toast("已作答");
  }
}
function submitAnswer() {
  const sel = selSession();
  if (!sel || !sel.s.waiting_request || !askState) return;
  const s = sel.s;
  const qs = s.waiting_request.questions;
  const answers = qs.map((q, qi) => {
    const free = (askState.free[qi] || "").trim();
    if (free) return free;
    const sel = [...askState.sel[qi]];
    if (q.multi) return sel.join("、");
    return sel[0] ?? "";
  });
  if (answers.some((a) => !a)) { toast("还有问题未作答"); return; }
  sendAnswer(answers);
}

$("saveSrvBtn").onclick = () => {
  const kind = formKind;
  const url = $("url").value.trim();
  const token = $("token").value.trim();
  if (!url) { toast(kind === "cloud" ? "请填写云桥地址" : "请填写 ws 地址"); $("url").focus(); return; }
  if (kind === "lan" && !token) { toast("直连需要 token"); $("token").focus(); return; }
  const name = $("srvName").value.trim() || (kind === "cloud" ? "云桥" : hostOf(url));
  if (editId) {
    const cfg = cfgOf(editId);
    if (!cfg) { setFormKind(kind, null); return; }
    const old = ctxs.get(cfg.id);
    if (old) { disconnectCtx(old, "重新配置中"); ctxs.delete(cfg.id); }
    cfg.name = name; cfg.kind = kind; cfg.wsUrl = url; cfg.token = token;
    if (kind === "cloud") {
      // 编辑不丢配对：已配对身份沿用；未配对回落烘焙值
      const keep = cfg.cloud && cfg.cloud.paired && cfg.cloud.rd && cfg.cloud.rk ? cfg.cloud : null;
      cfg.cloud = keep
        ? { url, token: token || BAKED_BRIDGE_TOKEN, rd: keep.rd, rk: keep.rk, paired: true }
        : { url, token: token || BAKED_BRIDGE_TOKEN, rd: BAKED_RELAY.rd, rk: BAKED_RELAY.rk, paired: false };
    } else cfg.cloud = undefined;
    saveServers();
    setFormKind(kind, null);
    if (canAutoConnect(cfg)) connectServer(cfg);
  } else {
    // 同桥双云源会互踢（桥按 dev 顶替，dev 由共享 E2E 身份派生），添加时拦截
    if (kind === "cloud") {
      const dup = servers.find((s) => s.kind === "cloud" && s.wsUrl === url);
      if (dup) { toast("已有同地址云源「" + dup.name + "」，同桥两条源会互踢断连"); return; }
    }
    const cfg = { id: uuid(), name, kind, wsUrl: url, token };
    if (kind === "cloud") cfg.cloud = { url, token: token || BAKED_BRIDGE_TOKEN, rd: BAKED_RELAY.rd, rk: BAKED_RELAY.rk, paired: false };
    servers.push(cfg);
    saveServers();
    if (!activeServerId) { activeServerId = cfg.id; try { localStorage.setItem(ACTIVE_KEY, activeServerId); } catch {} }
    setFormKind(kind, null);
    if (canAutoConnect(cfg)) connectServer(cfg);
  }
  renderServers(); renderConnChip();
};

// ---------- Slash 命令联想（与手机端 slash.ts 同构） ----------
// 内置表与 relay/src/ws-server.ts BUILTIN_COMMANDS 同步维护；LAN 源 fetch
// /api/commands 拿用户/项目自定义命令（60s 缓存），云源/失败回落内置表
const SLASH_BUILTIN = [
  ["compact", "压缩对话历史，释放上下文"],
  ["clear", "清空当前会话历史"],
  ["help", "查看帮助"],
  ["model", "查看/切换模型"],
  ["cost", "当前会话 token 用量"],
  ["context", "上下文使用概况"],
  ["memory", "编辑项目记忆 CLAUDE.md"],
  ["init", "为当前项目初始化 CLAUDE.md"],
  ["review", "审查 PR / 代码变更"],
  ["resume", "恢复历史会话"],
  ["rename", "重命名当前会话"],
  ["export", "导出当前会话记录"],
  ["todos", "查看当前任务清单"],
  ["permissions", "权限规则管理"],
  ["config", "打开配置面板"],
  ["mcp", "MCP 服务器管理"],
  ["statusline", "状态栏配置"],
  ["output-style", "切换输出风格"],
  ["add-dir", "添加额外工作目录"],
  ["vim", "切换 vim 按键模式"],
  ["doctor", "Claude Code 健康检查"],
  ["login", "切换账号"],
  ["bug", "报告问题"],
  ["release-notes", "查看更新日志"],
].map(([name, desc]) => ({ name, desc, source: "builtin" }));
const slashCache = new Map();
let slashList = SLASH_BUILTIN;
function slashHttpBase(cfg) {
  try { const u = new URL(cfg.wsUrl); return (u.protocol === "wss:" ? "https://" : "http://") + u.host; }
  catch { return ""; }
}
async function slashFetch() {
  const sel = selSession();
  if (!sel) return;
  const cfg = sel.ctx.cfg;
  if (cfg.kind !== "lan") { slashList = SLASH_BUILTIN; return; } // 云源：HTTP 到不了 relay
  const base = slashHttpBase(cfg);
  const cwd = sel.s.cwd ?? "";
  const key = base + "|" + cwd;
  const hit = slashCache.get(key);
  if (hit && Date.now() - hit.ts < 60000) { slashList = hit.list; updateSlashBox(); return; }
  const wantSrc = sel.ctx.cfg.id, wantSid = sel.s.session_id;
  try {
    const r = await fetch(base + "/api/commands?token=" + encodeURIComponent(cfg.token) + "&cwd=" + encodeURIComponent(cwd));
    if (!r.ok) throw new Error(String(r.status));
    const j = await r.json();
    if (!j?.ok || !Array.isArray(j.commands)) throw new Error("bad shape");
    const cur = selSession(); // 慢请求期间切了会话/源：丢弃结果，别污染新会话的联想
    if (!cur || cur.ctx.cfg.id !== wantSrc || cur.s.session_id !== wantSid) return;
    const list = j.commands.filter((c2) => c2 && typeof c2.name === "string");
    slashCache.set(key, { ts: Date.now(), list });
    slashList = list;
  } catch { slashList = SLASH_BUILTIN; }
  updateSlashBox();
}
function slashMatches(q) {
  const s = q.trim().toLowerCase();
  if (!s) return slashList.slice(0, 8);
  return slashList.filter((c2) => c2.name.toLowerCase().startsWith(s) || (c2.desc || "").toLowerCase().includes(s)).slice(0, 8);
}
function updateSlashBox() {
  const box = $("slashbox");
  const v = $("msginput").value;
  const q = v.startsWith("/") && !/\s/.test(v) ? v.slice(1) : null;
  if (q === null || !selSession()) { box.style.display = "none"; return; }
  const ms = slashMatches(q);
  box.innerHTML = ms.length
    ? ms.map((m) => '<div class="sl-row" data-n="' + escapeHtml(m.name) + '"><span class="sl-name">/' + escapeHtml(m.name) + "</span>" +
      '<span class="sl-desc">' + escapeHtml(m.desc || "") + "</span>" +
      (m.source && m.source !== "builtin" ? '<span class="sl-src">' + (m.source === "user" ? "用户" : "项目") + "</span>" : "") + "</div>").join("")
    : '<div class="sl-empty">无匹配命令，Enter 原样发送</div>';
  box.style.display = "block";
}
$("slashbox").addEventListener("mousedown", (e) => {
  const row = e.target.closest(".sl-row");
  if (!row) return;
  e.preventDefault(); // 不让输入框失焦
  $("msginput").value = "/" + row.dataset.n + " ";
  syncSendState();
  updateSlashBox();
  $("msginput").focus();
});
$("msginput").addEventListener("input", () => {
  updateSlashBox();
  const v = $("msginput").value;
  if (v.startsWith("/") && !/\s/.test(v)) void slashFetch();

function startCardRename(cardEl, s, ctx) {

  const old = s.title || "";

  const inp = document.createElement("input");
  inp.className = "card-rename";
  inp.value = old;
  titleEl.appendChild(inp);
  inp.focus();
  inp.select();
  let done = false;
  const finish = (submit) => {
    if (done) return;
    done = true;
    const v = inp.value.trim();
    if (submit && v && v !== old) sendCommandTo(ctx, "COMMAND_RENAME", { session_id: s.session_id, title: v });

  };
  inp.onkeydown = (ev) => {
    ev.stopPropagation();
    if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
    else if (ev.key === "Escape") finish(false);
  };
  inp.onclick = (ev) => ev.stopPropagation();
  inp.onblur = () => finish(false);
}

$("thinkBtn").onclick = () => {
  thinkShown = !thinkShown;
  renderDetail();
};
// 正文 fontSize 档位（紧凑/标准/大）：CSS 变量驱动时间线全部相对字号
const TL_SCALES = [["紧凑", 0.92], ["标准", 1], ["大", 1.15]];
let tlScaleIdx = TL_SCALES.findIndex(([, v]) => String(v) === lsGet("ccr_tl_scale"));
if (tlScaleIdx < 0) tlScaleIdx = 1;
function applyTlScale() {
  const [label, v] = TL_SCALES[tlScaleIdx];
  document.documentElement.style.setProperty("--tl-scale", String(v));
  lsSet("ccr_tl_scale", String(v));
  $("fontBtn").textContent = "字·" + label;
}
$("fontBtn").onclick = () => {
  tlScaleIdx = (tlScaleIdx + 1) % TL_SCALES.length;
  applyTlScale();
};
applyTlScale();
$("themeBtn").textContent = document.documentElement.classList.contains("light") ? "🌙" : "☀️";
document.querySelector('meta[name="theme-color"]')?.setAttribute(
  "content", document.documentElement.classList.contains("light") ? "#F3F5F9" : "#050B12");
$("permBtn").onclick = () => {
  const sel = selSession();
  if (!sel || sel.s.external || sel.s.historical) return;
  const cur = sel.s.permission_mode ?? "default";
  const next = PERM_CYCLE[(PERM_CYCLE.indexOf(cur) + 1) % PERM_CYCLE.length];
  sendCommandTo(sel.ctx, "COMMAND_PERM", { session_id: selected.sid, mode: next });
};
document.querySelectorAll(".tabs button.tab").forEach((b) => {
  b.onclick = () => {
    activeTab = b.dataset.tab;
    document.querySelectorAll(".tabs button.tab").forEach((x) => x.classList.toggle("active", x === b));
    $("timeline").dataset.count = "";
    renderDetail();
  };
});

// 秒级走时：已等待/耗时/回合计时每秒刷新（innerHTML 由 key 守卫，代价极小）
setInterval(() => { if (selected) renderDetail(); }, 1000);

// ---------- 配对码与初始化 ----------
// 输码配对：目标 = 编辑中的云源，或由表单现填地址即时创建的新云源（配对成功落成一条云源记录）。
// rd/rk 优先取本源已配对记忆，被清/首次用页面内嵌烘焙值兜底。
// 提交后走与配对链接完全相同的 pair_req → pair_ack 流程。
function submitPairCode() {
  const code = $("pairCode").value.trim();
  if (!/^\d{6}$/.test(code)) { toast("请输入 6 位数字配对码"); $("pairCode").focus(); return; }
  loadCloudIdentity();
  let cfg = editId ? cfgOf(editId) : null;
  if (cfg && cfg.kind !== "cloud") { toast("仅云桥类型支持配对码"); return; }
  if (!cfg) {
    const url = $("url").value.trim() || defaultCloudUrl();
    const token = $("token").value.trim() || BAKED_BRIDGE_TOKEN;
    cfg = { id: uuid(), name: $("srvName").value.trim() || "云桥", kind: "cloud", wsUrl: url, token,
      cloud: { url, token, rd: BAKED_RELAY.rd, rk: BAKED_RELAY.rk, paired: false } };
    servers.push(cfg);
  }
  const c = cfg.cloud || (cfg.cloud = { url: cfg.wsUrl, token: serverBridgeToken(cfg), rd: BAKED_RELAY.rd, rk: BAKED_RELAY.rk, paired: false });
  const src = c.paired && c.rd && c.rk ? { rd: c.rd, rk: c.rk } : BAKED_RELAY;
  if (!src.rd || !src.rk) { toast("缺少 relay 信息，请使用配对链接"); return; }
  const pair = { rd: src.rd, rk: src.rk, pc: code };
  setPendingPair(cfg.id, pair);
  const ctx = ensureCtx(cfg);
  ctx.pendingPair = pair;
  $("pairCode").value = "";
  saveServers();
  renderServers();
  connectCloudFor(ctx, true);
}
$("pairBtn").onclick = submitPairCode;
$("pairCode").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitPairCode(); } });

// 同机零配置直连：探测本机 relay（/local-info 仅 loopback 可访问，Chrome/Edge 豁免 loopback 混合内容）
async function probeLocalRelay() {
  try {
    const r = await fetch("http://127.0.0.1:8787/local-info", { signal: AbortSignal.timeout?.(1500) });
    if (!r.ok) return null;
    const j = await r.json().catch(() => null);
    return j && j.ok && j.token ? j : null;
  } catch { return null; }
}

(async function init() {
  // 旧单源配置迁移 → servers 列表（含首次使用的烘焙默认源种子）
  migrateLegacy();
  activeServerId = lsGet(ACTIVE_KEY) || "";
  if (!cfgOf(activeServerId)) activeServerId = servers[0]?.id || "";
  setFormKind("lan", null);
  // 配对链接：#bt=<桥token>&rd=<relay dev>&rk=<relay 公钥>&pc=<一次性配对码>。
  // 参数走 fragment（不落服务器日志/Referer），捕获后立刻从地址栏抹掉；
  // 目标：同址云源优先复用，否则新建一条云源，配对凭据按源存 sessionStorage。
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("pc") && h.get("rd") && h.get("rk")) {
    const url = location.protocol.startsWith("http")
      ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/cloud" : "";
    const bt = h.get("bt") || "";
    let target = servers.find((s) => s.kind === "cloud" && (!url || s.wsUrl === url));
    if (!target) {
      const u = url || defaultCloudUrl();
      target = { id: uuid(), name: "云桥", kind: "cloud", wsUrl: u, token: bt || BAKED_BRIDGE_TOKEN,
        cloud: { url: u, token: bt || BAKED_BRIDGE_TOKEN, rd: BAKED_RELAY.rd, rk: BAKED_RELAY.rk, paired: false } };
      servers.push(target);
    } else if (bt) {
      target.token = bt;
      if (target.cloud) target.cloud.token = bt;
    }
    setPendingPair(target.id, { rd: h.get("rd"), rk: h.get("rk"), pc: h.get("pc") });
    saveServers();
    history.replaceState(null, "", location.pathname);
  }
  // 旧入口兼容：?token= 直连令牌预填进直连表单
  const params = new URLSearchParams(location.search);
  if (params.get("token")) { setFormKind("lan", null); $("token").value = params.get("token"); }
  $("cwd").value = lsGet("ccr_cwd") || "";
  // 空的直连占位：探测本机 relay，命中即补全（同机零配置）
  const ph = servers.find((s) => s.kind === "lan" && !s.wsUrl);
  if (ph) {
    const local = await probeLocalRelay();
    if (local) {
      ph.wsUrl = "ws://127.0.0.1:8787/ws";
      ph.token = local.token;
      saveServers();
      toast("检测到本机 CC Deck Relay，已自动连接");
    }
  }
  // 所有源同时保持连接（一处断另一处还在）
  connectAll();
  renderServers(); renderConnChip(); render();
  // 引导：没有任何可用源（云源未配对且无可用直连）→ 打开面板聚焦配对码
  const usable = servers.some((s) => (s.kind === "lan" ? (s.wsUrl && s.token) : !!s.cloud?.paired));
  if (!usable) {
    openPanel("conn");
    const un = servers.find((s) => s.kind === "cloud" && !s.cloud?.paired);
    if (un) { setFormKind("cloud", un); setTimeout(() => $("pairCode").focus(), 80); }
  }
})();
</script>
