name: relay

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DEV-38/R5①（2026-11-28）矩阵单源化：矩阵键唯一事实源 = relay/tests/ci.json
  # （前史：W-P2BATCH4 矩阵漂移守卫——「矩阵键必须在 package.json 注册」拼写向 +
  #   anchored 锚定集/键数抬锚丢键向，双登记手抄；46→65 十一次手动抬锚史见 git log
  #   本文件。单源化后 anchored/键数抬锚废除：矩阵由本 job 从 ci.json 生成，test job
  #   fromJSON 消费；丢键=改 ci.json（reviewed diff 可见），不再是 YAML 手抄盲区。）
  # 前置闸：校验失败 test job 不启动（needs 依赖），拼写错/结构坏在第一分钟红。
  matrix-guard:
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.gen.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 } # DEV-25：与 test job 同源对齐（本 job 只跑 node -e 守卫，无包产物）
      - name: 矩阵单源校验 + 生成（ci.json → test job matrix）
        id: gen
        run: |
          node -e '
            const fs = require("fs");
            // 本 job 无 defaults working-directory，cwd=repo 根——路径用 repo 根视角
            const ci = JSON.parse(fs.readFileSync("relay/tests/ci.json", "utf8"));
            const matrix = ci.matrix, quarantine = Object.keys(ci.quarantine || {});
            if (!Array.isArray(matrix) || matrix.length === 0) { console.error("ERR: ci.json matrix 必须为非空数组"); process.exit(1); }
            if (matrix.some(k => typeof k !== "string")) { console.error("ERR: ci.json matrix 含非字符串键"); process.exit(1); }
            if (new Set(matrix).size !== matrix.length) { console.error("ERR: ci.json matrix 含重复键"); process.exit(1); }
            const overlap = matrix.filter(k => quarantine.includes(k));
            if (overlap.length) { console.error("ERR: 键同时出现在 matrix 与 quarantine: [" + overlap.join(", ") + "]"); process.exit(1); }
            const pkg = JSON.parse(fs.readFileSync("relay/package.json", "utf8"));
            const scripts = new Set(Object.keys(pkg.scripts || {}));
            // 拼写向（matrix + quarantine 键都必须在 package.json 注册——quarantine 键本地仍可跑）
            const bad = [...matrix, ...quarantine].filter(k => !scripts.has(k));
            if (bad.length) { console.error("ERR: ci.json 键未在 package.json 注册（拼写错/漂移）: [" + bad.join(", ") + "]"); process.exit(1); }
            // 结构向：防止手抄矩阵行回归（单源化前的旧形态）
            const yml = fs.readFileSync(".github/workflows/relay.yml", "utf8");
            if (/script: *\[[^\]]/.test(yml)) { console.error("ERR: relay.yml 检出内联矩阵清单（旧手抄形态回归）——矩阵只能由 relay/tests/ci.json 生成"); process.exit(1); }
            const out = JSON.stringify(matrix);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "scripts=" + out + "\n");
            console.log("OK: 矩阵 " + matrix.length + " 键自 ci.json 生成，拼写向全注册，隔离台账 " + quarantine.length + " 键");
          '

  test:
    needs: [matrix-guard]
    name: relay tests (${{ matrix.script }})
    runs-on: ubuntu-latest
    # bridge 用例含大量真实定时器等待（重连退避/心跳/队列晋升），CI 上整体
    # 跑到 ~25s/断言，15min 只能过 29/171 项就撞墙——放宽到 45min
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # 矩阵键自唯一事实源 relay/tests/ci.json 生成（matrix-guard job）——增删键只改
      # ci.json，本文件不再出现第二份清单。只收自包含测试（进程内/回环网络/
      # fake-injector/mkdtemp 沙盒，不需要 Claude CLI 与 API 凭据）：
      # test:sessions / test:ws 拉起真实 claude CLI 子进程并等待真实模型回合，
      # CI 无 CLI/凭据必挂，属设计态排除（红基线定罪台账见 ci.json quarantine）。
      # test:org / test:leader（#26 M1）纯 fs+假工厂；test:projects / test:dispatch
      #   （#26 M2）mkdtemp 沙盒假工厂派单；test:routing（#26 M3）路由表纯 fs 单测；
      # test:autorevive（#75/#17）假工厂+fs 夹具；test:settings（#17）三层合成纯单元；
      # test:settings-ws（#17 补强）子进程真 relay ×3，CCR_NO_LEADER=1 保证不拉 CLI；
      # test:codex（#27 P0）/bin/sh 桩脚本替真 codex CLI；test:artifacts-dead（#224）/
      #   test:deliver-session（#227/#230）mkdtemp 沙盒纯单元；
      # test:sqlite-resilience（#158 批1）驱动失败降级纯注入；
      # test:lan-boot（CONNV4D-fix1）真子进程+真组播，CCR_MDNS_IP 私有组隔离+哑桥；
      # DEV-21 批 A 五新套件（resume-degrade/patrol-escalate/cloud-hbthrottle/
      #   data-guard/swapguard）假工厂/pinSandbox/纯函数自包含。
      matrix:
        script: ${{ fromJSON(needs.matrix-guard.outputs.scripts) }}
    defaults:
      run:
        working-directory: relay

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # DEV-25 sqlite ABI 治标：20→22 对齐生产运行时系统 node（v22.x = ABI 127）
          # ——测试环境与生产同版，better-sqlite3 相关套件（sqlite-resilience 等）不再
          # 跑在「CI node 20 绿、生产 node 22 炸」的盲区。与 desktop.yml mac job
          # pin 同源对齐（同一提交内一起动）。
          node-version: 22
          cache: npm
          cache-dependency-path: |
            relay/package-lock.json
            cloud-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      # relay 的 tests/test-cloud.ts 进程内 import ../cloud-bridge 源码，
      # tsc/tsx 都会从 cloud-bridge 向上解析 ws —— 必须同装其依赖
      - name: Install cloud-bridge dependencies
        run: npm ci
        working-directory: cloud-bridge

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run ${{ matrix.script }}
        run: npm run ${{ matrix.script }}
