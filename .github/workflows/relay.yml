name: relay

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: relay tests (${{ matrix.script }})
    runs-on: ubuntu-latest
    # bridge 用例含大量真实定时器等待（重连退避/心跳/队列晋升），CI 上整体
    # 跑到 ~25s/断言，15min 只能过 29/171 项就撞墙——放宽到 45min
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 只跑自包含测试：进程内/回环网络/fake-injector，不需要 Claude CLI 与 API 凭据。
        # test:sessions / test:ws 通过 agent SDK query() 拉起真实 claude CLI 子进程并
        # 等待真实模型回合完成，CI 无 CLI/凭据必挂，故排除。
        # test:org / test:leader（#26 矩阵式 M1）：纯 fs + agentFactory 假工厂，同为自包含
        # test:projects / test:dispatch（#26 矩阵式 M2）：mkdtemp 沙盒 + 假工厂派单收口，同上
        # test:routing（#26 矩阵式 M3）：路由表 store 纯 fs 单测，同上
        # test:autorevive（#75/#17）：自动拉起纯单元（假工厂+fs 夹具，含雇员独立家读家锁），同上
        # test:settings（#17 第二批）：设置三层合成纯单元（env>file>default + 热切换广播），同上
        # test:settings-ws（#17 第二批补强）：子进程真 relay 起停 ×3（新装物化/存量收敛/env
        #   锁定），纯协议断言不创建会话——CCR_NO_LEADER=1 显式关掉启动序的 Leader
        #   首建（不设则无锚即真拉 Leader CLI，「不拉 CLI」靠开关保证而非碰巧），CI 可跑
        # test:codex（#27 P0）：CodexAgentSession 用 /bin/sh 桩脚本替代真 codex CLI
        #   （CCR_CODEX_PATH 注入），零 codex 二进制零 API key，CI 可跑
        # test:artifacts-dead（#224）/ test:deliver-session（#227/#230，dev 0.6.1/0.6.2 线）：
        #   输出物下发口径与会话身份挂账，均 mkdtemp 沙盒纯单元，CI 可跑
        # test:sqlite-resilience（#158 批1）：better-sqlite3 驱动失败降级 json 档——纯
        #   fs 夹具+驱动注入（不真换二进制），linux runner 上驱动本就可载，CI 可跑
        # W-CARDLIFE-R4 第二轮解并（1106）：dev 再进（aggregatev1 #44+inboxv1r1 #47）——全量并集任何一侧不丢
        # W-MERGEFIX3 第三轮解并（1106）：dev 再进（resumebanner/seatlive/pmresourcev1 #52）——全量并集任何一侧不丢
        script: [test:boardtruth, test:laneflip, test:boardrecon, test:dutybackoffr2, test:277-team-create-redesign, test:artifacts-dead, test:autorevive, test:bridge, test:bus, test:cardlife, test:subagent, test:cardlifer2, test:cloud, test:codex, test:deliver-session, test:dispatch, test:dispatchbomb, test:engdistb, test:dutywire, test:history, test:inboxv1, test:leader, test:linkquality, test:org, test:aggregatev2, test:org-defects, test:pmseat, test:pmappoint-gap, test:prbackflow, test:prchip, test:projects, test:prreview, test:reviewseat, test:routing, test:settings, test:settings-ws, test:sqlite-resilience, test:teampolish, test:teamdissolve, test:aggbug]
    defaults:
      run:
        working-directory: relay

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            relay/package-lock.json
            cloud-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      # relay 的 scripts/test-cloud.ts 进程内 import ../cloud-bridge 源码，
      # tsc/tsx 都会从 cloud-bridge 向上解析 ws —— 必须同装其依赖
      - name: Install cloud-bridge dependencies
        run: npm ci
        working-directory: cloud-bridge

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run ${{ matrix.script }}
        run: npm run ${{ matrix.script }}

  # W-P2BATCH4 件2（矩阵漂移守卫，1106 同日第四咬的最小版治本）：矩阵是自包含测试的
  # 白名单精选（package.json 158 个 test:* 大量是本地/需真 CLI 的设计态排除——双向差集
  # 不可用），守卫单向：**矩阵键必须在 package.json 注册**（拼写错/键漂移即红）——今日
  # 两轮收割各咬一次的并集解冲突（键错/丢）在 CI 前置拦截。生成式方案回执备案不实施。
  # 注：job 必须完整独立成块——插在 test 的 defaults 与 steps 之间会把 steps 块错挂到
  # 本 job（YAML 映射被兄弟键打断不可续写，重复 steps 键后者覆盖=测试主 job 静默失明）。
  matrix-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 矩阵键守卫（双向：拼写向+丢键向）
        run: |
          node -e '
            const fs = require("fs");
            // 本 job 无 defaults working-directory，cwd=repo 根——路径用 repo 根视角
            const yml = fs.readFileSync(".github/workflows/relay.yml", "utf8");
            const m = yml.match(/script: \[([^\]]+)\]/);
            if (!m) { console.error("ERR: relay.yml 未找到 script: [...] 矩阵行"); process.exit(1); }
            const matrix = m[1].split(",").map(s => s.trim()).filter(Boolean);
            const pkg = JSON.parse(fs.readFileSync("relay/package.json", "utf8"));
            const scripts = new Set(Object.keys(pkg.scripts || {}));
            // 方向①（拼写向）：矩阵键必须在 package.json 注册
            const bad = matrix.filter(k => !scripts.has(k));
            if (bad.length) { console.error("ERR: 矩阵键未在 package.json 注册（拼写错/漂移）: [" + bad.join(", ") + "]"); process.exit(1); }
            // W-P2BATCH4-R1 方向②（丢键向——A 审备案法）：核心键锚定+键数下限。
            // 全量反向不可用（pkg 158 个 test:* 大量设计态排除≠精选矩阵）；键丢=CI 静默
            // 少跑（#46 R4 实锤形态）——锚定集与上行 script: [...] 同源维护（键增改这里）。
            const anchored = ["test:boardtruth","test:laneflip","test:boardrecon","test:dutybackoffr2","test:277-team-create-redesign","test:artifacts-dead","test:autorevive","test:bridge","test:bus","test:cardlife","test:subagent","test:cardlifer2","test:cloud","test:codex","test:deliver-session","test:dispatch","test:dispatchbomb","test:engdistb","test:dutywire","test:history","test:inboxv1","test:leader","test:linkquality","test:org","test:aggregatev2","test:org-defects","test:pmseat","test:pmappoint-gap","test:prbackflow","test:prchip","test:projects","test:prreview","test:reviewseat","test:routing","test:settings","test:settings-ws","test:sqlite-resilience","test:teampolish","test:teamdissolve"];
            const dropped = anchored.filter(k => !matrix.includes(k));
            if (dropped.length) { console.error("ERR: 矩阵丢键（删整键盲区——键丢=测试静默不跑）: [" + dropped.join(", ") + "]（锚定集随 script 行同源维护）"); process.exit(1); }
            if (matrix.length < 36) { console.error("ERR: 矩阵键数 " + matrix.length + " < 36 下限（批量丢键形式——键增同步抬锚定值；W-BOARDTRUTH5 增 boardrecon+锚定债补齐 aggregatev2/pmappoint-gap 抬至 36）"); process.exit(1); }
            console.log("OK: 矩阵 " + matrix.length + " 键双向守卫过（拼写向全注册+丢键向 36 锚定键全在+键数下限 36）");
          '
