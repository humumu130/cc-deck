name: android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # tag 触发时用 github.token 创建 Release（零 secrets：不用 secrets 上下文）

jobs:
  build:
    name: assembleRelease APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # W-RELAYFRESHCI：relay lock 入缓存键（下方重建步在 relay 目录 npm ci）
          cache-dependency-path: |
            expo-app/package-lock.json
            relay/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install JS dependencies
        working-directory: expo-app
        run: npm ci --no-audit --no-fund

      - name: Sync version from tag (snapshot 通道标识)
        # -snap tag 构建把 tag 名烙进 versionName（如 0.4.23-snap.2）：关于页/设置抽屉
        # 显示完整通道版本 + "快照版"角标，用户可区分快照包与正式包（正式 tag 无后缀，
        # versionName 保持仓库 checked-in 值，两者互不干扰）
        # -test tag 同款烙印（2026-09-16）：本地 test 包版本化 test.N 与 snap 风格统一
        if: startsWith(github.ref, 'refs/tags/') && (contains(github.ref, '-snap') || contains(github.ref, '-test') || !contains(github.ref, '-'))
        working-directory: expo-app
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" app.json

      - name: Stamp dev suffix (无 tag 验证构建通道标识)
        # workflow_dispatch/push 触发的无 tag 构建是验证包（adb 装机用，不发 Release 不碰
        # latest.json），但 versionName 裸用仓库值会与正式版撞名（2026-09-18 用户装机见
        # "0.5.2"误当正式包）。烙 -dev.<run_number>：关于页一眼可辨，且 run 号可反查构建
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: expo-app
        run: |
          V=$(node -e "console.log(require('./app.json').expo.version)")-dev.${{ github.run_number }}
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" app.json
          echo "stamped: $V"

      - name: Rebuild embedded relay bundle + freshness gate（W-RELAYFRESHCI）
        # 同 desktop.yml（test.98/99 陈账事故治本，2026-11-05）：APK 本身不内嵌
        # relay bundle（expo-app 无消费面），本步是纯闸位——① 同一 tag 触发的
        # 所有出包 job 一致强制过闸：tag==VERSION 断言让「打了 tag 但 VERSION
        # 没 bump」在 android 面也红（与 desktop 面互为冗余证词）；② 当场重建
        # 保证本 job 工作区与 desktop job 同源（未来 APK 若嵌 relay，闸已在位）。
        # relay npm ci 在 ubuntu 上拉的 better-sqlite3/esbuild 为 linux-x64，
        # 仅进本 job 工作区闭包，APK 不消费，无平台影响。
        # 闸须在本步内重建后立即跑（下方无烙印步再碰 web-console，无顺序冲突）。
        working-directory: relay
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-plugin.mjs
          ARGS=""
          if [[ "$GITHUB_REF_NAME" == v* ]]; then ARGS="--expect-tag ${GITHUB_REF_NAME#v}"; fi
          node scripts/check-embedded-freshness.mjs $ARGS

      - name: Build release APK
        working-directory: expo-app/android
        # 2026-10-11 用户拍板 nova 变体 → 1103 W-NOVAONLY 收敛：nova 已是唯一通道
        #（plain 退役，与 desktop.yml 同口径——手机装机面本就全线 nova 清单）。恒
        # -PAPP_VARIANT=nova 出包（原双装设计「与 com.humumu.ccwatch 共存」口径退役）。标准包如需
        # 本地构建去掉该传参即可（W-NOVAVAR B1 双形态接线）。
        run: ./gradlew assembleRelease -PAPP_VARIANT=nova --stacktrace

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-snap')
        working-directory: expo-app/android/app/build/outputs/apk/release
        # 瘦身（2026-09-10）：splits 后无 app-release.apk——正式分发包取 arm64 单架构
        #（34.8MB；v7a 首选版翻车：新款国产机（OPPO 等）固件纯 64 位拒装 32 位包）；
        # v7a 版（极老 32 位机备查）随 artifact 归档
        run: |
          cp app-arm64-v8a-release.apk "CC-Deck-${GITHUB_REF_NAME}.apk"
          cp app-armeabi-v7a-release.apk "CC-Deck-${GITHUB_REF_NAME}-v7a.apk"

      - name: Deploy reminder（console-guardrails ③ 出包≠部署——1030 黄底事故防再犯）
        shell: bash
        run: |
          echo "::warning::⚠️ 本包不含部署，需手动部署面同步——APK 只进 artifact/Release，运行端不会自动更新"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ⚠️ 部署链提醒（console-guardrails ③）
          本 CI 只出包。核对表见 artifact 内 DEPLOY-CHECKLIST.md；桌面侧另跑 scripts/deploy-web.sh 四面同步。
          EOF
          cat > DEPLOY-CHECKLIST.md <<'CHK'
          部署清单核对表（console-guardrails ③）
          ⚠️ 本包不含部署步——运行端不会随 APK 自动更新。
          - [ ] APK 已挂 Release / 分发链接可下
          - [ ] 手机端装机后「关于」显示完整通道版本（latest-test.json 已更新）
          - [ ] 桌面侧部署面同步（若同批有桌面出包）
          CHK
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Deck-${{ github.ref_name }}
          path: |
            expo-app/android/app/build/outputs/apk/release/*.apk
            DEPLOY-CHECKLIST.md
          if-no-files-found: error

      - name: Create GitHub Release with APK
        # -test 包不建 Release（test 分发纪律：只走 ECS 裸 IP，不污染 Release/CF 主域）
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-snap') && !contains(github.ref, '-test')
        uses: softprops/action-gh-release@v2
        with:
          # 默认 GITHUB_TOKEN 即 github.token（token 参数缺省值），无需任何 secrets
          files: |
            expo-app/android/app/build/outputs/apk/release/CC-Deck-${{ github.ref_name }}.apk
            expo-app/android/app/build/outputs/apk/release/CC-Deck-${{ github.ref_name }}-v7a.apk
          generate_release_notes: true
