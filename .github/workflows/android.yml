name: android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # tag 触发时用 github.token 创建 Release（零 secrets：不用 secrets 上下文）

jobs:
  build:
    name: assembleRelease APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install JS dependencies
        working-directory: expo-app
        run: npm ci --no-audit --no-fund

      - name: Build release APK
        working-directory: expo-app/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: expo-app/android/app/build/outputs/apk/release
        run: cp app-release.apk "CC-Deck-${GITHUB_REF_NAME}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Deck-${{ github.ref_name }}
          path: expo-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 默认 GITHUB_TOKEN 即 github.token（token 参数缺省值），无需任何 secrets
          files: expo-app/android/app/build/outputs/apk/release/CC-Deck-${{ github.ref_name }}.apk
          generate_release_notes: true
