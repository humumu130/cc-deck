name: desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # tag 触发时用 github.token 把产物挂到 Release（零 secrets）

jobs:
  build:
    name: Electron NSIS + zip
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Smoke test (load console + probe local relay mock)
        working-directory: desktop
        shell: bash
        run: |
          # 冒烟不依赖真实 relay：起一个假 /local-info（HTTP 200 JSON），验证 file:// 加载、
          # nacl 加载与探测写回全链路（electron 主进程 fetch 127.0.0.1:8787）
          node smoke-server.mjs > smoke.log 2>&1 &
          SRV=$!
          npx electron . --smoke
          CODE=$?
          kill $SRV 2>/dev/null || true
          cat smoke.log 2>/dev/null || true
          exit $CODE

      - name: Sync version from tag
        # 产物版本号跟随 tag：electron-builder 从 package.json 读版本烙进 exe 元数据/文件名，
        # 本地手动构建回落到 package.json 里的checked-in 值
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build NSIS + portable zip
        working-directory: desktop
        run: npx electron-builder --win nsis zip --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Deck-Desktop-${{ github.ref_name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          generate_release_notes: true

  build-tauri:
    name: Tauri NSIS（换壳试水，与 Electron 共存）
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install tauri-cli (npm runner，免 cargo install 冷编译)
        working-directory: desktop-tauri
        run: npm ci --no-audit --no-fund

      - name: Regenerate icons from desktop/build/icon.png
        # 图标生成物已提交（src-tauri/icons/），此处幂等重生成，源图更新后 CI 自动跟上
        working-directory: desktop-tauri
        run: npx tauri icon ../desktop/build/icon.png

      - name: Sync version from tag
        # tauri.conf.json 的 version 指向 ../package.json，同步它即可
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop-tauri
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build NSIS
        working-directory: desktop-tauri
        shell: bash
        run: |
          npx tauri build --bundles nsis
          # 产物名对齐 Electron 版（CC-Deck-Setup-<v>.exe）并加 -tauri 后缀区分两壳
          # 就地重命名（挪出 nsis 目录会让下面两处 path 扑空，v0.3.13 实际翻车点）
          V=$(node -p "require('./package.json').version")
          mv src-tauri/target/release/bundle/nsis/*-setup.exe "src-tauri/target/release/bundle/nsis/CC-Deck-Setup-${V}-tauri.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Deck-Desktop-Tauri-${{ github.ref_name }}
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/CC-Deck-Setup-*-tauri.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/CC-Deck-Setup-*-tauri.exe
          generate_release_notes: true
