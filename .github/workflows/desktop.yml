name: desktop

# W-NOVAONLY（用户 1103 拍板）：plain（"CC Deck"）通道退役——本 workflow 收敛为
# Nova 单通道。历史：W15 双装变体设计=与已装正式版并排不覆盖（独立 productName/
# identifier/mainBinaryName/updater 清单）；用户装机面全线已是 Nova 后双通道分发
# 只剩误发风险（1103 事故：PM 误发 plain win exe → tauri.windows.conf.json
# decorations:true 系统标题栏形态 → 用户顶栏两行误报）。收敛红线：**Nova 已装
# 用户更新链一秒不能断**——tauri.nova.conf.json 的 endpoint
# （tauri-latest-nova.json / -test tag 烙 tauri-latest-nova-test.json）零改动；
# plain 的 tauri-latest.json / tauri-latest-test.json 停发（存量键已清）。
# tag 门（两 job 前置步）：无 -nova 后缀的 tag 一律 fail-fast——再想出 plain 包
# 必须显式回滚本门（防误发事故重演的结构闸）。历史 plain tag 重跑场景不再支持。
# 配置面注记：tauri.windows.conf.json（plain 的 Windows decorations:true 形态）保留
# 原样不动——CI 门控后已无 plain 消费路径（nova overlay 自带完整 windows 定义覆盖
# decorations），文件本身即历史形态档案。**勿给它加 $comment 之类注记字段**：Tauri
# 平台 conf merge 走严格 schema，额外属性直接炸 Windows 构建（test.89-nova CI 实锤
# `Additional properties are not allowed ('$comment')`，test.90 还原后绿）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      nova:
        # Nova 单通道（plain 退役后唯一变体；default true——dispatch 出包恒 Nova）
        description: "Nova 变体（单通道唯一形态，plain 已退役）"
        type: boolean
        default: true

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # tag 触发时用 github.token 把产物挂到 Release（零 secrets）

jobs:
  build-tauri:
    name: Tauri NSIS（换壳试水，与 Electron 共存）
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Nova-only tag gate（plain 通道退役门，W-NOVAONLY）
        # 无 -nova 后缀的 tag = plain 包请求 → fail-fast（1103 误发事故结构闸）。
        # dispatch（非 tag）不受本门限（inputs.nova 已默认 true 恒走 overlay）
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-nova')
        run: |
          echo "::error::tag ${GITHUB_REF_NAME} 无 -nova 后缀——plain 通道已退役（用户 1103 拍板），本 CI 只出 Nova 包。要出包请打 v<ver>-nova[-test.N] tag；确需 plain（回滚决策）请先回滚本门。"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install tauri-cli (npm runner，免 cargo install 冷编译)
        working-directory: desktop-tauri
        run: npm ci --no-audit --no-fund

      - name: Replace better-sqlite3 binary with win32-x64 prebuilt
        # #158（2026-10-08）：resources/node_modules 闭包由 dev 机（macOS arm64）经
        # relay/scripts/build-plugin.mjs 汇集，better_sqlite3.node 是 darwin-arm64
        # Mach-O——0.7.0-test.3 Windows 包实锤：内嵌 relay 启动即 dlopen
        # ERR_DLOPEN_FAILED，8787 永不监听。此步在 Windows runner 上按闭包内
        # package.json 的版本重拉 win32-x64 prebuilt 覆盖（better-sqlite3 官方发
        # prebuilt，prebuild-install 按 runner 的 node ABI 自动选包）；mac job 不需
        # 此步——dev 机汇集的 arm64 恰为 mac 目标形态（两平台来源注记见 mac job）。
        # relay 侧已加纵深防御（驱动可失败加载+读面降级 json 档），此步是根修。
        working-directory: desktop-tauri/src-tauri/resources/node_modules/better-sqlite3
        shell: bash
        run: |
          # 主路：闭包目录内直接 prebuild-install（闭包含 package.json，name/version 足其选包）
          if ! npx --yes prebuild-install; then
            # 回落：临时目录整包安装（npm install 自动跑包内 install 脚本=prebuild-install），
            # 再拷二进制——闭包被裁过（无 deps/src），prebuild-install 缺文件时兜底
            echo "prebuild-install 直跑失败，回落临时目录整包安装"
            VER=$(node -p "require('./package.json').version")
            TMP=$(mktemp -d)
            (cd "$TMP" && npm install --no-audit --no-fund --no-save "better-sqlite3@$VER")
            cp "$TMP/node_modules/better-sqlite3/build/Release/better_sqlite3.node" build/Release/better_sqlite3.node
            rm -rf "$TMP"
          fi
          # 验证：PE 头两字节必须 4D 5A（"MZ"）——非 win32 PE 即 fail-fast，杜绝 Mach-O/ELF 再进包
          node -e '
            const b = require("fs").readFileSync("build/Release/better_sqlite3.node");
            if (b[0] !== 0x4d || b[1] !== 0x5a) {
              console.error(`better_sqlite3.node 非 win32 PE（头字节 ${b[0].toString(16)} ${b[1].toString(16)}），中止构建`);
              process.exit(1);
            }
            console.log(`better_sqlite3.node = win32 PE（${(b.length / 1024 / 1024).toFixed(1)} MB）`);
          '

      - name: Regenerate icons from desktop/build/icon.png
        # 图标生成物已提交（src-tauri/icons/），此处幂等重生成，源图更新后 CI 自动跟上
        working-directory: desktop-tauri
        run: npx tauri icon ../desktop/build/icon.png

      - name: Sync version from tag
        # tauri.conf.json 的 version 指向 ../package.json，同步它即可
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-snap')
        working-directory: desktop-tauri
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Sync version from tag (snapshot 通道标识)
        # -snap tag 把完整通道版本烙进产物（2026-09-16：此前 snap 包关于页显示裸 0.5.1，
        # 用户无法区分快照/正式——对齐 android.yml 的 versionName 烙印模式）
        # ① package.json → tauri 版本/updater 元数据；② web-console CONSOLE_VERSION → 关于页显示
        # （frontendDist 构建期打包进二进制，sed 只改 CI 工作区副本，不回写仓库）
        if: startsWith(github.ref, 'refs/tags/') && (contains(github.ref, '-snap') || contains(github.ref, '-test'))
        working-directory: desktop-tauri
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$V"
          sed -i "s/const CONSOLE_VERSION = \"[^\"]*\"/const CONSOLE_VERSION = \"$V\"/" ../web-console/index.html
          # 005 新壳（0.7.0-test.3 起桌面主页面）同烙：常量唯一定义位=头部 __ccDeck005Version
          #（console-guardrails ④：旧 sed 模式在 005 无命中=烙印静默丢失）
          sed -i "s/__ccDeck005Version = \"[^\"]*\"/__ccDeck005Version = \"$V\"/" ../web-console/index-005.html
          # #119 test 通道在线更新：endpoint 烙成 test 专用清单，通道隔离在编译期
          # 锁定——test 包永远查不到正式清单，semver 天然按 test.N 序号递增判更新
          # （build-test-desktop.sh 产出该清单）。
          # #122 血泪（test.13/14 双击秒退）：updater 插件启动即校验 endpoint 必须
          # https，http 的 ECS 兜底直接 panic（exit 0xC0000409）——endpoints 只能
          # 放 https 源；ECS 明文兜底等 CF Tunnel 有了 https 域名（acc.）再补第二条
          if [[ "$GITHUB_REF_NAME" == *-test.* ]]; then
            sed -i 's#https://cc.humumu.online/download/tauri-latest.json#https://cc.humumu.online/download/tauri-latest-test.json#' src-tauri/tauri.conf.json
            grep -n "tauri-latest-test" src-tauri/tauri.conf.json
            # nova 变体同烙（tag 路径 nova 检测见 Build NSIS 步骤）：通道隔离一致性——
            # nova test 包若指向正式 nova 清单，正式清单版本更高时会穿仓提示「升级」
            if [ -f src-tauri/tauri.nova.conf.json ]; then
              sed -i 's#https://cc.humumu.online/download/tauri-latest-nova.json#https://cc.humumu.online/download/tauri-latest-nova-test.json#' src-tauri/tauri.nova.conf.json
              grep -n "tauri-latest-nova-test" src-tauri/tauri.nova.conf.json
            fi
          fi

      - name: Stamp dev suffix (无 tag 验证构建通道标识)
        # 对齐 android.yml 同名步骤：无 tag 验证包烙 -dev.<run_number>，关于页不再与
        # 正式版撞名（2026-09-18 用户装机见裸 "0.5.2" 误当正式包）。只改 CI 工作区副本
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: desktop-tauri
        shell: bash
        run: |
          V=$(node -e "console.log(require('./package.json').version)")-dev.${{ github.run_number }}
          npm version --no-git-tag-version --allow-same-version "$V"
          sed -i "s/const CONSOLE_VERSION = \"[^\"]*\"/const CONSOLE_VERSION = \"$V\"/" ../web-console/index.html
          sed -i "s/__ccDeck005Version = \"[^\"]*\"/__ccDeck005Version = \"$V\"/" ../web-console/index-005.html
          echo "stamped: $V"

      - name: Build NSIS
        working-directory: desktop-tauri
        shell: bash
        env:
          # updater 签名（#319）：私钥/密码来自 repo Secrets，产物 .sig 与 latest.json 随之生成
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          CONFIG_ARGS=""
          # nova 变体双入口：dispatch 勾选 / tag 名含 -nova 后缀（test 包走 tag 路径，
          # inputs 恒空——v0.7.0-test.5-nova 先例，nova 共存包与版本烙印两全）。
          # [W-NOVAONLY] 收敛后 plain 生产路径已全线关门：tag 面=Nova-only gate fail-fast
          #（上方退役门），dispatch 面=nova 缺省 true——**不勾 nova 是 plain 的唯一显式
          # 回滚口**（等价「回滚本门」，需有权限者主动为之；出包后 plain 清单也已停发，
          # 还需手动重铺 KV/ECS 键才能真的分发——双层摩擦即事故闸）
          if [ "${{ inputs.nova }}" = "true" ] || [[ "$GITHUB_REF_NAME" == *-nova ]]; then
            CONFIG_ARGS="--config src-tauri/tauri.nova.conf.json"
            echo "NOVA_SUFFIX=-Nova" >> "$GITHUB_ENV"
            echo "nova variant: overlay tauri.nova.conf.json active（productName/identifier/updater）"
            echo "nova variant: mainBinaryName=cc-deck-nova——主 exe 改名，NSIS 运行检测不再误杀旧版同名进程"
          fi
          npx tauri build --bundles nsis $CONFIG_ARGS
          # 不再改名：updater 的 latest.json 按原始产物名（CC Deck Tauri_<v>_x64-setup.exe）寻址

      - name: Artifact name suffix（分支名含 / 会炸 upload-artifact）
        shell: bash
        run: echo "REF_SLUG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Verify DPI manifest（win-font-aa ①：出包 exe 实证 PerMonitorV2 烙印）
        working-directory: desktop-tauri
        shell: bash
        run: |
          # 背景（1101 用户 2K 屏字体锯齿批）：排查期实证 shipped exe manifest 已含
          # <dpiAwareness>PerMonitorV2, PerMonitor</dpiAwareness>（tao 运行时 V2 焊死），
          # 但该烙印来自 tauri-build 内嵌模板——tauri/tao 升级若丢声明=位图拉伸模糊回归
          # 且无人知晓（「安装包版本说谎 22 天」同族）。本闸=出包实物抽查，闸口制非提醒制。
          # 链路：NSIS 内层文件压缩 → 7z 解出 {app}/*.exe（nova 变体改名 cc-deck-nova，
          # 通配兜双名）→ PE 的 .rsrc 段 manifest 为未压缩明文 → grep -a 直证。
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          7z x -o"$RUNNER_TEMP/nsis-extract" "$EXE" >/dev/null 2>&1 || true # CI 修：滤 '{app}\*.exe' 通配在 runner 7z 上对 nova 变体提不出（78 实锤）——全解后 find 兜双名
          BIN=$(find "$RUNNER_TEMP/nsis-extract" -iname '*.exe' ! -iname 'uninst*' | head -1)
          if [ -n "$BIN" ] && grep -a -q 'PerMonitorV2' "$BIN"; then
            echo "✅ DPI manifest 实证：主 exe 含 PerMonitorV2（tao V2 烙印在位）"
            grep -a -o '<dpiAwareness>[^<]*<' "$BIN" | head -1 || true
          elif [ -n "$BIN" ]; then
            echo "::error::主 exe 无 PerMonitorV2 字样——DPI 烙印失败（tauri-build 升级丢声明=2K 屏位图拉伸回归，2K/4K 外接屏全糊）"
            exit 1
          else
            echo "::error::NSIS 内层 exe 提取失败（7z 未出 {app}/*.exe）——闸无法实证按失败处理（防静默漏检，排障先看 7z 路径形态）"
            ls -R "$RUNNER_TEMP/nsis-extract" || true
            exit 1
          fi

      - name: Deploy reminder（console-guardrails ③ 出包≠部署——1030 黄底事故防再犯）
        shell: bash
        run: |
          echo "::warning::⚠️ 本包不含部署，需手动部署面同步（scripts/deploy-web.sh）——运行端 console/relay 不会随本包自动更新"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ⚠️ 部署链提醒（console-guardrails ③）
          本 CI 只出包不含部署步。出包后必须：`scripts/deploy-web.sh` 四面同步 + 运行端关于页双版本核验（壳 vX · 界面 vY 一致）。核对表见 artifact 内 DEPLOY-CHECKLIST.md。
          EOF
          cat > DEPLOY-CHECKLIST.md <<'CHK'
          部署清单核对表（console-guardrails ③）
          ⚠️ 本包不含部署步——tag 直出 CI 只出包，运行端界面/relay 不会自动同步！
          - [ ] scripts/deploy-web.sh 四面同步（cc-plugins/Nova Resources/relay-service/CF）
          - [ ] -test 通道：latest-test.json 已更新（手机端关于页完整通道版本可见）
          - [ ] 运行端验证：关于页「壳 vX · 界面 vY」一致（错配横幅不出现=护栏①通过）
          - [ ] 打包完整抽验：包内 web-console 含 js/ css/ 全量（护栏②通过——tauri.conf 目录映射）
          CHK
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Deck-Desktop-Tauri${{ env.NOVA_SUFFIX }}-${{ env.REF_SLUG }}
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            desktop-tauri/src-tauri/target/release/bundle/nsis/latest.json
            desktop-tauri/src-tauri/target/release/bundle/latest.json
            DEPLOY-CHECKLIST.md
          if-no-files-found: error

      - name: Attach to GitHub Release
        # -test 包不建 Release（test 分发纪律：只走 ECS/KV，不污染 Release）
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-snap') && !contains(github.ref, '-test')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            desktop-tauri/src-tauri/target/release/bundle/nsis/latest.json
            desktop-tauri/src-tauri/target/release/bundle/latest.json
            DEPLOY-CHECKLIST.md
          generate_release_notes: true

  build-tauri-mac:
    # #71 Mac 桌面端：Tauri 代码全平台通用，仅打包目标不同（dmg/app）。
    # 不签名不公证——无 Apple 账号永久可用（首次右键→打开绕 Gatekeeper），
    # 有账号后可加 Developer ID 签名 + notarize 消除首次摩擦
    name: Tauri dmg（macOS-aarch64，未签名）
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Nova-only tag gate（plain 通道退役门，W-NOVAONLY）
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-nova')
        run: |
          echo "::error::tag ${GITHUB_REF_NAME} 无 -nova 后缀——plain 通道已退役（用户 1103 拍板），本 CI 只出 Nova 包。"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install tauri-cli
        working-directory: desktop-tauri
        run: npm ci --no-audit --no-fund

      - name: Regenerate icons
        working-directory: desktop-tauri
        run: npx tauri icon ../desktop/build/icon.png

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-snap')
        working-directory: desktop-tauri
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Sync version from tag (snapshot 通道标识)
        # 同 Windows job：snap tag 烙印 package.json + 关于页 CONSOLE_VERSION
        if: startsWith(github.ref, 'refs/tags/') && (contains(github.ref, '-snap') || contains(github.ref, '-test'))
        working-directory: desktop-tauri
        shell: bash
        # sed -i.bak：macOS BSD sed 的 -i 必须带备份后缀参数（GNU 写法在 mac runner
        # 上把表达式当后缀 → "invalid command code ."，2026-09-16 test.1 mac job 教训）
        run: |
          V="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$V"
          sed -i.bak "s/const CONSOLE_VERSION = \"[^\"]*\"/const CONSOLE_VERSION = \"$V\"/" ../web-console/index.html
          rm -f ../web-console/index.html.bak
          # 005 新壳同烙（同 Windows job：无 __shellVer 壳注入，CONSOLE_VERSION 即显示源）
          sed -i.bak "s/const CONSOLE_VERSION = \"[^\"]*\"/const CONSOLE_VERSION = \"$V\"/" ../web-console/index-005.html
          rm -f ../web-console/index-005.html.bak
          # #119 同 Windows job：test tag 烙 test 专用 updater 清单（Mac test 包虽被
          # UPDATER_BLOCKED 拦住不发请求，endpoint 同改保持一致，放开只需清单加 mac 条目）
          # #122 同 Windows job 教训：endpoint 只能 https（ECS http 兜底会让 exe 启动即 panic）
          if [[ "$GITHUB_REF_NAME" == *-test.* ]]; then
            sed -i.bak 's#https://cc.humumu.online/download/tauri-latest.json#https://cc.humumu.online/download/tauri-latest-test.json#' src-tauri/tauri.conf.json
            rm -f src-tauri/tauri.conf.json.bak
            grep -n "tauri-latest-test" src-tauri/tauri.conf.json
            # W-NOVAVAR B3：nova overlay 同烙（同 Windows job :119-122）——nova test 包若指向
            # 正式 nova 清单，正式清单版本更高时会穿仓提示「升级」。overlay 只在 Build 步
            # --config 传入时 merge，此处无条件烙不伤标准构建
            if [ -f src-tauri/tauri.nova.conf.json ]; then
              sed -i.bak 's#https://cc.humumu.online/download/tauri-latest-nova.json#https://cc.humumu.online/download/tauri-latest-nova-test.json#' src-tauri/tauri.nova.conf.json
              rm -f src-tauri/tauri.nova.conf.json.bak
              grep -n "tauri-latest-nova-test" src-tauri/tauri.nova.conf.json
            fi
          fi

      - name: Stamp dev suffix (无 tag 验证构建通道标识)
        # 同 Windows job 的 dev 烙印：无 tag 验证包 -dev.<run_number>，防与正式版撞名。
        # sed -i.bak：macOS BSD sed 同上（test.1 教训）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: desktop-tauri
        shell: bash
        run: |
          V=$(node -e "console.log(require('./package.json').version)")-dev.${{ github.run_number }}
          npm version --no-git-tag-version --allow-same-version "$V"
          sed -i.bak "s/const CONSOLE_VERSION = \"[^\"]*\"/const CONSOLE_VERSION = \"$V\"/" ../web-console/index.html
          rm -f ../web-console/index.html.bak
          sed -i.bak "s/const CONSOLE_VERSION = \"[^\"]*\"/const CONSOLE_VERSION = \"$V\"/" ../web-console/index-005.html
          rm -f ../web-console/index-005.html.bak
          echo "stamped: $V"

      - name: Build dmg
        # #158 两平台二进制来源注记：resources/node_modules 的 better_sqlite3.node 由
        # dev 机（macOS arm64）汇集，对 mac dmg 目标恰好正确，故本 job 无需替换步；
        # Windows job（上方 build-tauri）由 prebuild-install 步现场重拉 win32-x64 覆盖。
        # 改动汇集逻辑（relay/scripts/build-plugin.mjs 2b）时两平台都要顾。
        working-directory: desktop-tauri
        shell: bash
        env:
          # updater 签名与 Windows 共用（密钥对平台无关）；macOS 应用签名留空 = ad-hoc
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          CONFIG_ARGS=""
          # W-NOVAVAR B3（W-AUDIT-CONTRACT P1-5）：nova 双入口对齐 Windows job——dispatch
          # 勾选 / tag 名含 -nova 后缀（test 包走 tag 路径，inputs 恒空）。缺此分支时
          # v*-nova tag 出的是标准变体 dmg 但版本烙成 nova 名（名实不符，曾靠本地手工补）
          if [ "${{ inputs.nova }}" = "true" ] || [[ "$GITHUB_REF_NAME" == *-nova ]]; then
            CONFIG_ARGS="--config src-tauri/tauri.nova.conf.json"
            echo "NOVA_SUFFIX=-Nova" >> "$GITHUB_ENV"
            echo "nova variant: overlay tauri.nova.conf.json active（productName/identifier/updater）"
          fi
          # #190（W-UPDCHAIN）：dmg → app,dmg——Tauri v2 的 macOS updater 工件
          #（*.app.tar.gz+.sig）附产于 app bundle（createUpdaterArtifacts:true；首 dispatch
          # 实证 dmg,updater 不产——updater 非 v2 合法 target 被静默忽略）。dmg 保留直发。
          # artifact 上传的 macos/*.app.tar.gz* 通配本就在场，从此有物可收
          npx tauri build --bundles app,dmg --target aarch64-apple-darwin $CONFIG_ARGS

      - name: Artifact name suffix（分支名含 / 会炸 upload-artifact）
        shell: bash
        run: echo "REF_SLUG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Deploy reminder（console-guardrails ③ 出包≠部署——1030 黄底事故防再犯）
        shell: bash
        run: |
          echo "::warning::⚠️ 本包不含部署，需手动部署面同步（scripts/deploy-web.sh）——运行端 console/relay 不会随本包自动更新"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ⚠️ 部署链提醒（console-guardrails ③）
          本 CI 只出包不含部署步。出包后必须：`scripts/deploy-web.sh` 四面同步 + 运行端关于页双版本核验（壳 vX · 界面 vY 一致）。核对表见 artifact 内 DEPLOY-CHECKLIST.md。
          EOF
          cat > DEPLOY-CHECKLIST.md <<'CHK'
          部署清单核对表（console-guardrails ③）
          ⚠️ 本包不含部署步——tag 直出 CI 只出包，运行端界面/relay 不会自动同步！
          - [ ] scripts/deploy-web.sh 四面同步（cc-plugins/Nova Resources/relay-service/CF）
          - [ ] -test 通道：latest-test.json 已更新（手机端关于页完整通道版本可见）
          - [ ] 运行端验证：关于页「壳 vX · 界面 vY」一致（错配横幅不出现=护栏①通过）
          - [ ] 打包完整抽验：包内 web-console 含 js/ css/ 全量（护栏②通过——tauri.conf 目录映射）
          CHK
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Deck-Desktop-Tauri-Mac${{ env.NOVA_SUFFIX }}-${{ env.REF_SLUG }}
          path: |
            desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig
            desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

      - name: Attach to GitHub Release
        # -test 包不建 Release（test 分发纪律：只走 ECS/KV，不污染 Release）
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-snap') && !contains(github.ref, '-test')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig
          generate_release_notes: true
