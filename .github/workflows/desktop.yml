name: desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # tag 触发时用 github.token 把产物挂到 Release（零 secrets）

jobs:
  build-tauri:
    name: Tauri NSIS（换壳试水，与 Electron 共存）
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install tauri-cli (npm runner，免 cargo install 冷编译)
        working-directory: desktop-tauri
        run: npm ci --no-audit --no-fund

      - name: Regenerate icons from desktop/build/icon.png
        # 图标生成物已提交（src-tauri/icons/），此处幂等重生成，源图更新后 CI 自动跟上
        working-directory: desktop-tauri
        run: npx tauri icon ../desktop/build/icon.png

      - name: Sync version from tag
        # tauri.conf.json 的 version 指向 ../package.json，同步它即可
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-snap')
        working-directory: desktop-tauri
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Sync version from tag (snapshot 通道标识)
        # -snap tag 把完整通道版本烙进产物（2026-09-16：此前 snap 包关于页显示裸 0.5.1，
        # 用户无法区分快照/正式——对齐 android.yml 的 versionName 烙印模式）
        # ① package.json → tauri 版本/updater 元数据；② web-console CONSOLE_VERSION → 关于页显示
        # （frontendDist 构建期打包进二进制，sed 只改 CI 工作区副本，不回写仓库）
        if: startsWith(github.ref, 'refs/tags/') && (contains(github.ref, '-snap') || contains(github.ref, '-test'))
        working-directory: desktop-tauri
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$V"
          sed -i "s/const CONSOLE_VERSION = \"[^\"]*\"/const CONSOLE_VERSION = \"$V\"/" ../web-console/index.html
          # #119 test 通道在线更新：endpoint 烙成 test 专用清单（CF 主源公司可达 + ECS
          # 兜底），通道隔离在编译期锁定——test 包永远查不到正式清单，semver 天然
          # 按 test.N 序号递增判更新（build-test-desktop.sh 产出该清单）
          if [[ "$GITHUB_REF_NAME" == *-test.* ]]; then
            sed -i 's#https://cc.humumu.online/download/tauri-latest.json#https://cc.humumu.online/download/tauri-latest-test.json#' src-tauri/tauri.conf.json
            sed -i 's#https://github.com/humumu130/cc-deck/releases/latest/download/latest.json#http://8.133.211.170:8888/tauri-latest-test.json#' src-tauri/tauri.conf.json
            grep -n "tauri-latest-test" src-tauri/tauri.conf.json
          fi

      - name: Stamp dev suffix (无 tag 验证构建通道标识)
        # 对齐 android.yml 同名步骤：无 tag 验证包烙 -dev.<run_number>，关于页不再与
        # 正式版撞名（2026-09-18 用户装机见裸 "0.5.2" 误当正式包）。只改 CI 工作区副本
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: desktop-tauri
        shell: bash
        run: |
          V=$(node -e "console.log(require('./package.json').version)")-dev.${{ github.run_number }}
          npm version --no-git-tag-version --allow-same-version "$V"
          sed -i "s/const CONSOLE_VERSION = \"[^\"]*\"/const CONSOLE_VERSION = \"$V\"/" ../web-console/index.html
          echo "stamped: $V"

      - name: Build NSIS
        working-directory: desktop-tauri
        shell: bash
        env:
          # updater 签名（#319）：私钥/密码来自 repo Secrets，产物 .sig 与 latest.json 随之生成
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --bundles nsis
          # 不再改名：updater 的 latest.json 按原始产物名（CC Deck Tauri_<v>_x64-setup.exe）寻址

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Deck-Desktop-Tauri-${{ github.ref_name }}
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            desktop-tauri/src-tauri/target/release/bundle/nsis/latest.json
            desktop-tauri/src-tauri/target/release/bundle/latest.json
          if-no-files-found: error

      - name: Attach to GitHub Release
        # -test 包不建 Release（test 分发纪律：只走 ECS/KV，不污染 Release）
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-snap') && !contains(github.ref, '-test')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            desktop-tauri/src-tauri/target/release/bundle/nsis/latest.json
            desktop-tauri/src-tauri/target/release/bundle/latest.json
          generate_release_notes: true

  build-tauri-mac:
    # #71 Mac 桌面端：Tauri 代码全平台通用，仅打包目标不同（dmg/app）。
    # 不签名不公证——无 Apple 账号永久可用（首次右键→打开绕 Gatekeeper），
    # 有账号后可加 Developer ID 签名 + notarize 消除首次摩擦
    name: Tauri dmg（macOS-aarch64，未签名）
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install tauri-cli
        working-directory: desktop-tauri
        run: npm ci --no-audit --no-fund

      - name: Regenerate icons
        working-directory: desktop-tauri
        run: npx tauri icon ../desktop/build/icon.png

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-snap')
        working-directory: desktop-tauri
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Sync version from tag (snapshot 通道标识)
        # 同 Windows job：snap tag 烙印 package.json + 关于页 CONSOLE_VERSION
        if: startsWith(github.ref, 'refs/tags/') && (contains(github.ref, '-snap') || contains(github.ref, '-test'))
        working-directory: desktop-tauri
        shell: bash
        # sed -i.bak：macOS BSD sed 的 -i 必须带备份后缀参数（GNU 写法在 mac runner
        # 上把表达式当后缀 → "invalid command code ."，2026-09-16 test.1 mac job 教训）
        run: |
          V="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$V"
          sed -i.bak "s/const CONSOLE_VERSION = \"[^\"]*\"/const CONSOLE_VERSION = \"$V\"/" ../web-console/index.html
          rm -f ../web-console/index.html.bak
          # #119 同 Windows job：test tag 烙 test 专用 updater 清单（Mac test 包虽被
          # UPDATER_BLOCKED 拦住不发请求，endpoint 同改保持一致，放开只需清单加 mac 条目）
          if [[ "$GITHUB_REF_NAME" == *-test.* ]]; then
            sed -i.bak 's#https://cc.humumu.online/download/tauri-latest.json#https://cc.humumu.online/download/tauri-latest-test.json#' src-tauri/tauri.conf.json
            sed -i.bak 's#https://github.com/humumu130/cc-deck/releases/latest/download/latest.json#http://8.133.211.170:8888/tauri-latest-test.json#' src-tauri/tauri.conf.json
            rm -f src-tauri/tauri.conf.json.bak
            grep -n "tauri-latest-test" src-tauri/tauri.conf.json
          fi

      - name: Stamp dev suffix (无 tag 验证构建通道标识)
        # 同 Windows job 的 dev 烙印：无 tag 验证包 -dev.<run_number>，防与正式版撞名。
        # sed -i.bak：macOS BSD sed 同上（test.1 教训）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: desktop-tauri
        shell: bash
        run: |
          V=$(node -e "console.log(require('./package.json').version)")-dev.${{ github.run_number }}
          npm version --no-git-tag-version --allow-same-version "$V"
          sed -i.bak "s/const CONSOLE_VERSION = \"[^\"]*\"/const CONSOLE_VERSION = \"$V\"/" ../web-console/index.html
          rm -f ../web-console/index.html.bak
          echo "stamped: $V"

      - name: Build dmg
        working-directory: desktop-tauri
        shell: bash
        env:
          # updater 签名与 Windows 共用（密钥对平台无关）；macOS 应用签名留空 = ad-hoc
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles dmg --target aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Deck-Desktop-Tauri-Mac-${{ github.ref_name }}
          path: |
            desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig
            desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

      - name: Attach to GitHub Release
        # -test 包不建 Release（test 分发纪律：只走 ECS/KV，不污染 Release）
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-snap') && !contains(github.ref, '-test')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig
          generate_release_notes: true
